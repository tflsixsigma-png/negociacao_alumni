d:"fund",curto:"Fundamentos",sec:"Fundamentos — Encontro 1",topicos:[{id:"lentes",t:"O que é negociação: as três lentes",fonte:"Ury · Thompson · Voss — material do curso",teoria:"Negociação é um processo interativo por meio do qual duas ou mais partes buscam chegar a um acordo mútuo — de uma mesa formal de contrato a uma conversa de corredor; muda o cenário, não o processo. Três autores iluminam ângulos diferentes. William Ury (antropólogo): comunicação de ida e volta, destinada a chegar a um acordo, quando você e o outro lado têm alguns interesses compartilhados e outros que se opõem. Leigh Thompson (psicóloga): processo de tomada de decisão interpessoal, necessário sempre que não podemos atingir nossos objetivos sozinhos. Chris Voss (ex-FBI): negociação é uma investigação psicológica. A síntese do curso: processo interativo · mistura de interesses · decisão conjunta · movido a perguntas.",insight:"Antes de cada reunião com um fornecedor, pergunte-se qual lente está faltando na sua preparação: você mapeou os interesses (Ury)? Sabe o que não consegue obter sozinho (Thompson)? Preparou as perguntas que vão investigar o outro lado (Voss)?"},{id:"dimensoes",t:"As três dimensões: Pessoas, Problemas, Processos",fonte:"Material do curso — Prof. Thiago Lima",teoria:"Toda negociação tem três dimensões. Pessoas: quem está na mesa — e quem influencia de fora, sem sentar (o comitê que aprova, a área técnica que especifica, o financeiro que libera o caixa). Problemas: o que está em disputa, e raramente é uma coisa só — numa mesa de compras, nunca é só preço: prazo, nível de serviço, alocação de riscos, garantias, vigência, condições de pagamento. Processos: as regras do jogo, quase sempre implícitas — como se decide, quem dá a palavra final, qual o rito (proposta → avaliação → aprovação → contrato). Quando a mesa trava, o problema raramente é o problema: costuma ser gente ou processo.",insight:"Regra de Ouro do curso: quem domina o processo, domina a mesa estruturalmente. No sourcing, publicar as regras antes — critérios de avaliação, etapas, prazos — não é formalidade: é a vantagem estrutural de quem redige o RFP e conduz o processo."},{id:"tensoes",t:"As três tensões — e como administrá-las",fonte:"Mnookin, Peppet & Tulumello — Beyond Winning",teoria:"Cada dimensão carrega uma tensão que não se resolve — se administra. Em Pessoas: Assertividade × Empatia — falar ou ouvir? Defender meu ponto ou entender o do outro? Os melhores fazem os dois no máximo. Em Problemas: Cooperar × Competir — criar valor juntos ou disputar o valor que existe (o Dilema do Negociador). Em Processos: Agente × Principal — negociar em nome de alguém cujos interesses não são 100% os seus. As três táticas de administração: transparência calibrada (revele em doses recíprocas: abra um pouco, observe, abra mais), os dois no máximo ('entendo seu fluxo de caixa — e a regra do programa é inegociável'), e o mandato como escudo ('a tese aprovada pelo comitê não permite').",insight:"O mandato como escudo é especialmente útil para a equipe: limites combinados antes com a diretoria protegem na mesa — a recusa deixa de ser pessoal e vira institucional, preservando o relacionamento com o fornecedor."},{id:"incerteza",t:"Risco × incerteza profunda",fonte:"Frank Knight (1921)",teoria:"Risco pode ser mensurado: há probabilidades, dados históricos, seguros e hedging. A incerteza profunda ('knightiana') envolve desconhecidos desconhecidos — os próprios resultados possíveis não são claros e não há base estatística para calcular probabilidades. Negociar objetos inéditos é negociar sob incerteza, não sob risco: não há série histórica, o horizonte é emergente e há gaps informacionais estruturais entre as partes. A consequência contratual: em vez de contratos fixos e detalhados, contratos adaptativos — com marcos, opções reais, tranches condicionais e instrumentos que adiam decisões até que mais informação exista.",insight:"Quando a contraparte pedir compromissos firmes sobre resultados que ninguém pode prever, a resposta madura não é recusar — é propor estrutura adaptativa: marcos técnicos com liberação condicionada. Isso protege os dois lados e demonstra sofisticação."},{id:"trl",t:"TRL e os três regimes de negociação",fonte:"Material do curso — Prof. Thiago Lima",teoria:"O TRL (Technology Readiness Level, escala NASA de 1 a 9) organiza a maturidade tecnológica — e também mapeia como a negociação muda ao longo do ciclo. Regime A — Negociação de Aprendizado (TRL 1–3): a pergunta é 'a tecnologia funciona?', a incerteza é científica e o valor é valor de opção; negociam-se recursos para aprendizado. Regime B — Negociação de Foco Estratégico (TRL 3–6): 'qual problema resolver?', incerteza estratégica, valor estratégico; negocia-se o direcionamento da tecnologia e as parcerias. Regime C — Negociação de Escala (TRL 6–9): 'essa oportunidade escala?', incerteza econômica, valor de mercado; negociam-se valuation, participação e governança. Princípio estratégico: no início a incerteza é científica, no meio é estratégica, no final é econômica.",insight:"Antes de discutir números com um fornecedor de solução inédita, identifique o regime. Cobrar métricas de mercado de uma tecnologia em TRL 4 — ou aceitar apenas 'promessa técnica' de uma em TRL 8 — é aplicar a ferramenta errada. A maturidade da solução contratada diz qual conversa cabe na mesa: serviço estabelecido se negocia por planilha e nível de serviço; tecnologia nova, por marcos e piloto."}]},{id:"met",curto:"Método",sec:"Método e preparação — Encontro 2",topicos:[{id:"barganha",t:"Barganha posicional e o maior pecado",fonte:"Fisher, Ury & Patton · material do curso",teoria:"Barganha posicional: cada lado declara uma posição extrema e faz concessões graduais até um meio-termo. Funciona numa feira, onde a relação dura cinco minutos; para quem depende de relações de anos, é um desastre em cinco atos: (1) produz acordos ineficientes — o meio-termo não obedece a critério algum; (2) deteriora relacionamentos — cada concessão é vivida como derrota, e o ressentimento hiberna até despertar nas decisões futuras; (3) premia o blefe — os dois lados inflam posições até ninguém saber o que é interesse real; (4) é letal em ecossistemas pequenos — a reputação de negociador predatório custa parcerias futuras; (5) consome tempo — cada semana extra queima recursos sem gerar valor. E o maior pecado: a paixão pela própria posição. A partir daí você não negocia mais para resolver o problema — negocia para não perder a queda de braço. O ego assume o volante, e quando o objetivo vira vencer, todo mundo perde. A resposta não é jogar melhor esse jogo: é mudar de jogo.",insight:"Sinal de alerta na mesa: quando você se pegar defendendo um número porque foi você que o disse — e não porque um critério o sustenta — é a paixão pela posição operando. Vá à varanda."},{id:"harvard",t:"Os quatro princípios de Harvard",fonte:"Fisher, Ury & Patton — Getting to Yes",teoria:"Princípio 1 — Separe as pessoas do problema: seja duro nas questões negociais, não com as pessoas. Se você pudesse simplesmente exigir o que deseja, não haveria negociação; se estamos na mesa, é porque precisamos do outro — e tratar mal quem você precisa não é dureza, é amadorismo. Princípio 2 — Negocie orientado por interesses, não por posições: procure enxergar os pontos não revelados, a razão das posições. Princípio 3 — Pense em opções criativas e de satisfação mútua: soluções precipitadas bloqueiam cooperação; critérios e condições podem possibilitar inúmeras soluções — e lembre-se: pessoas gostam de escolher. Princípio 4 — Defina critérios objetivos para o resultado: pondere as opções frente aos critérios definidos; a decisão final não pode vir da teimosia de quem cansa o outro primeiro.",insight:"Nunca leve uma proposta única: leve três estruturas aceitáveis para você. Quem escolhe entre as suas opções sente controle — e quem sente controle assina."},{id:"balcony",t:"Go to the balcony",fonte:"William Ury",teoria:"Nunca decida nada importante no calor. A varanda é o distanciamento mental de onde você recupera o único poder que ninguém tira de você: o de escolher a sua reação. E da varanda se faz a segunda coisa: avaliar a posição da outra parte com frieza — o que ele declarou? O que ele não declarou? Que pressão ele está sofrendo do lado de lá? Quem avalia o outro no calor da mesa vê um adversário; quem avalia da varanda vê um mapa.",insight:"Combine com a equipe um gatilho de varanda antes da reunião: qualquer integrante pode pedir 'dez minutos para alinhar internamente'. Pausar não é fraqueza — é a tática que impede decisões que o grupo lamentaria."},{id:"interesses",t:"Tipos de interesses e a arte das concessões",fonte:"Material do curso — Prof. Thiago Lima",teoria:"Em uma negociação típica, você primeiro analisa os seus interesses e os da outra parte; depois, durante a negociação, testa se a sua percepção estava correta. Os interesses são de três tipos: compartilháveis (todos desejam o mesmo — ninguém quer que a negociação se arraste), diferentes (custo × qualidade — a base das trocas que criam valor) e conflitantes (interesses opostos, tipicamente o preço). Medimos o sucesso pelo número de interesses garantidos — e eles envolvem muito mais do que dinheiro: garantias, prazos, informação, reputação. Como fazer concessões: destaque as suas concessões (o que é dado em silêncio não gera crédito), exija e defina reciprocidade, use concessões contingentes ('se vocês…, então nós…'), fracione as concessões e enfatize os benefícios.",insight:"Antes da mesa, classifique cada item do Espaço Negocial como compartilhável, diferente ou conflitante. Os 'diferentes' são o seu tesouro: é neles que uma concessão barata para o comprador pode ser valiosa para o fornecedor — e vice-versa."},{id:"posicao",t:"BATNA, posição de desistência, ZOPA e trocas",fig:"zopa",fonte:"Fisher, Ury & Patton · material do curso",teoria:"Quatro conceitos definem a sua posição antes de qualquer negociação. BATNA: sua melhor alternativa a um acordo — o curso de ação preferencial na ausência de acordo. Ela determina em que ponto você pode recusar uma proposta desfavorável; sem conhecê-la, você pode rejeitar uma proposta melhor do que a que aceitará no final, ou aceitar uma pior do que conseguiria em outra mesa. BATNA não é loteria, é engenharia: qualificar fornecedor alternativo, redesenhar a especificação, avançar conversa paralela — cada alternativa real construída fora da mesa é poder que entra com você na sala. Posição de desistência (preço de reserva): o ponto menos favorável até o qual você ainda aceita o acordo; deriva da BATNA e deve representar ao menos uma pequena melhoria sobre ela. ZOPA: a zona de possível acordo, na coincidência entre as duas posições de desistência — se não há sobreposição, não há ZOPA, a menos que novas variáveis entrem na mesa. Geração de valor por trocas: concessões baratas para um lado e valiosas para o outro expandem o acordo. Para estimar a BATNA e a desistência da outra parte: fontes do setor, publicações, relatórios e o máximo de conversas com pessoas da outra organização.",insight:"Nunca revele uma BATNA fraca — 'precisamos fechar este mês' convida termos agressivos. E se a ZOPA não existe no preço, crie-a em outra dimensão: prazo, escopo, marcos, propriedade dos dados."},{id:"precee",t:"A mesa de interação e os pilares do processo",fonte:"Material do curso — Prof. Thiago Lima",teoria:"O processo de negociação se apoia em três pilares: Tempo, Informação e Poder. E a interação na mesa segue cinco etapas: Preliminar (comentário inicial, o clima que abre a conversa), Razões (interesses — por que estamos aqui), Exposição (a apresentação dos argumentos), Clarificação (o ponto quase final, onde ambiguidades são eliminadas) e Encerramento (concluir a negociação garantindo a tomada de decisão). O fator de sucesso que as pesquisas e a prática mais confirmam: preparação, preparação e preparação. O que separa negociadores excelentes de medianos não é carisma, não é agressividade, não é lábia — é o que fizeram antes de sentar. Negociação se ganha na véspera.",insight:"Planeje a reunião pelas cinco etapas — inclusive quem conduz cada uma. E não pule a Clarificação: em termos de referência e minutas, é nela que se evita descobrir na execução que cada lado entendeu um escopo diferente."},{id:"equacao",t:"A Equação da Influência",fig:"equacao",fonte:"Stevenson Carlebach — Program on Negotiation, Harvard Law School · formulação adaptada no curso",teoria:"A Equação da Influência é um framework de Stevenson Carlebach, professor afiliado do Program on Negotiation da Harvard Law School, cujo programa leva o nome de “Overcoming Resistance: The Influence Equation”. A ideia central inverte o instinto: diante da resistência, a maior parte dos conselhos de persuasão manda refinar o argumento — o que raramente ajuda, porque não diagnostica por que o outro resiste. Empurrar mais forte tende a aumentar a resistência; ceder ensina à contraparte que resistir funciona. A saída é diagnosticar a causa e tratá-la. Na formulação que usamos neste curso: Influência = Persuasão ÷ Resistência. A persuasão soma três termos: Interesses (atendidos ou não), Raciocínio (lógico ou não) e Relacionamento (confiança ou desconfiança). A resistência é o denominador — e é o que fazemos crescer sem perceber: cada acusação sutil, cada pressão desnecessária, cada injustiça percebida aumenta o divisor e derruba a influência inteira, por melhores que sejam os argumentos. A preparação trabalha o primeiro termo (interesses atendidos); raciocínio e relacionamento acontecem na mesa; e as táticas de mesa existem, em grande parte, para impedir que a resistência cresça — ou para reduzi-la quando já cresceu.",insight:"Diagnóstico rápido quando a mesa emperra: o problema está no numerador ou no denominador? Se os argumentos são bons e nada avança, pare de argumentar — a resistência subiu, e a saída é rótulo, auditoria de acusações e senso de justiça, não mais um dado."}]},{id:"neg",curto:"O negociador",sec:"O negociador e as táticas — Encontro 3",topicos:[{id:"argumentacao",t:"Convencer × persuadir",fonte:"Material do curso — Prof. Thiago Lima",teoria:"Convencer usa argumentos racionais: números, estatísticas, fontes, leis. Persuadir usa argumentos emocionais — histórias, analogias, metáforas, exemplos, comparações — e não deve ser confundido com manipulação. Na prática, os dois se entrelaçam: um bom argumento racional é mais convincente quando comunicado de forma emocionalmente inteligente, e uma mensagem persuasiva torna-se mais ética e duradoura quando sustentada por fatos. A chave: tente entender o modelo da outra parte e apresente, preponderantemente, os seus argumentos no modelo dela.",insight:"Com um fundador Catalisador, a história do impacto convence mais que a planilha; com um Analítico, é o inverso. Prepare as duas versões do mesmo argumento — e escolha na mesa, depois de identificar o estilo."},{id:"cerebro",t:"Cérebro pensante × cérebro emocional",fonte:"Voss · material do curso",teoria:"O cérebro pensante envolve o córtex pré-frontal: decisão, planejamento, comportamento social, solução de problemas. O cérebro emocional envolve o sistema límbico — incluindo a amígdala, uma das principais áreas de controle da agressividade — que dispara as respostas de luta, fuga ou congelamento. Em negociações de alta tensão, a amígdala pode literalmente sequestrar o córtex pré-frontal: a pessoa continua falando, mas quem responde é o medo. A maioria das decisões humanas importantes é tomada pelo sistema emocional — por isso as táticas de empatia funcionam: verbalizar a emoção do outro reduz a ativação da amígdala e reabre o canal racional.",insight:"Quando a contraparte endurecer de repente, não rebata o argumento — trate a emoção primeiro ('parece que esse ponto tocou algo importante'). Argumento contra amígdala ativada é desperdício de munição."},{id:"confianca",t:"A base da confiança e a empatia tática",fig:"confianca",fonte:"Voss · material do curso",teoria:"A confiança se sustenta em três pilares: Autenticidade (eu experimento o verdadeiro você), Lógica (seu raciocínio e julgamento são sólidos) e Empatia (eu acredito que você se importa comigo e com meu sucesso). Sobre essa base opera a empatia tática: mostrar-se genuinamente interessado nos motivos, objetivos, desejos e emoções do outro lado — sem confundir com simpatia ou compaixão. Não é concordar; é compreender deliberadamente, para reduzir a reatividade da contraparte e construir influência baseada em confiança — o tipo de influência mais durável e de menor manutenção.",insight:"Empatia tática não cede nada: você pode compreender profundamente a pressão de caixa do fornecedor e ainda assim manter a régua do contrato. Compreender primeiro torna o 'não' subsequente muito mais aceitável."},{id:"escuta",t:"Escuta ativa",fig:"escuta",fonte:"Material do curso — Prof. Thiago Lima",teoria:"A escuta opera em três zonas de ativação: hiperativação (reatividade emocional, defensividade, impulsividade), ativação ótima (consciência do momento presente, abertura, curiosidade, consciência de limites) e hipoativação (entorpecimento, desconexão, inatividade). O triângulo da escuta ativa: faça perguntas abertas — curtas, não julgadoras, não sugestivas; fique em silêncio até que a outra parte responda; ouça com interesse; e reflita de volta — repetindo, parafraseando, reformulando. Dedicar mais tempo a ouvir do que a falar é, sistematicamente, o comportamento que negociadores dizem menos praticar.",insight:"Meta concreta para a próxima reunião com fornecedor: a equipe fala menos de 40% do tempo. Cada minuto que o outro lado fala a mais é informação de preparação que vocês não tinham."},{id:"vieses",t:"As armadilhas psicológicas, uma a uma",fonte:"Kahneman — Thinking, Fast and Slow · material do curso",teoria:"Oito vieses ameaçam a mesa. Mística da torta fixa: assumir que o valor é fixo e que todo ganho do outro é perda sua — procure expandir a torta antes de dividi-la. Ancoragem: o primeiro número fixa as expectativas de todos, mesmo quando arbitrário — não se ancore no valor inicial. Excesso de confiança: cuidado com o otimismo, sobretudo em projeções. Enquadramento: a mesma proposta parece diferente conforme a moldura — observe diferentes perspectivas. Disponibilidade: o recente e o vívido pesam demais — procure também informações menos recentes. Confirmação: buscamos o que confirma nossas crenças — procure dados que as refutem, ou que refutem o que a outra parte sugere. Perspectiva geral: não se perca em detalhes (lembre-se do Gorila — focados na cláusula, deixamos passar o essencial). Escalada do comprometimento: não se comprometa demais com escolhas fracassadas — investimento passado não justifica investimento futuro.",insight:"Designe um advogado do diabo por negociação: alguém da equipe com o papel explícito de buscar evidências contrárias e perguntar 'se estivéssemos começando hoje, faríamos essa aposta?'. Vieses raramente são vencidos de dentro — são vencidos por processo."},{id:"estilos",t:"Os quatro estilos de negociador",fonte:"Material do curso — Prof. Thiago Lima",teoria:"Catalisador: extrovertido, alta inflexão de voz, ávido por reconhecimento; se seus interesses são contrariados, mostra-se inconstante. Apoiador: orientado para relacionamento, busca associação; precisa de aceitação e tende a fugir do conflito — pode prometer coisas e não cumprir. Controlador: orientado para resultados, busca realização; decidido, eficiente, gosta de assumir riscos e também pode ser competitivo. Analítico: orientado para tarefas, busca segurança; pode ser teimoso e procrastinador — quer sempre mais informações, o que o torna indeciso. Nenhum estilo é melhor: cada um pede uma condução diferente da mesa.",insight:"Reconhecimento público para o Catalisador, segurança e tempo para o Analítico, objetividade para o Controlador, garantias de relacionamento para o Apoiador. E cuidado com a promessa fácil do Apoiador: confirme por escrito o que foi combinado."}]},{id:"tat",curto:"20 táticas",sec:"As 20 táticas — Encontro 3",topicos:[{id:"vinte",t:"As táticas e a Equação da Influência",fonte:"Prof. Thiago Lima — Canvas do curso",teoria:"As vinte táticas do Canvas não são uma lista solta: cada uma trabalha um termo da Equação da Influência. Constroem Relacionamento (confiança): cuidar dos relacionamentos, empatia tática, inteligência conversacional, uso da voz, atenção ao 7-38-55 e a conclusão positiva. Alimentam Interesses e Raciocínio (persuasão): reciprocidade, prova social, espelhamento, rótulos, perguntas calibradas, aversão à perda, Ackerman e ancoragem. Derrubam a Resistência (o denominador): senso de justiça, auditoria de acusações e o poder do não. E protegem a sua posição: ceticismo saudável, proteja-se e a disciplina da comunicação digital.",insight:"Não leve as vinte para a mesa: selecione cinco a sete para cada negociação, distribua papéis (quem rotula, quem pergunta, quem observa) e ensaie. Tática sem dono não acontece."},{id:"tat1",t:"1. Senso de justiça",fonte:"Thompson — material do curso",teoria:"Pessoas com poder de decisão destroem acordos vantajosos quando se sentem injustiçadas — e, no sentido inverso, aceitam acordos que não são ótimos quando percebem justiça no processo. Por isso a tática tem dois movimentos. Na abertura, estabeleça o compromisso: 'se em algum momento eu for injusto, me avise para tentarmos corrigir' ou 'é minha intenção tratá-lo de forma justa'. E evite o uso acusatório do termo — 'fiz uma oferta justa' ou 'só quero o que é justo' soam como acusação sutil e elevam a resistência. Se a acusação vier contra você: 'eu ficaria feliz se me mostrasse onde fui injusto — estou aberto a corrigir'.",insight:"Adote a frase de abertura como padrão das mesas com fornecedores. Ela custa dez segundos, derruba o denominador da Equação da Influência antes da pauta começar e cria o canal para a contraparte sinalizar desconforto antes de ele virar impasse."},{id:"tat2",t:"2. Cuide dos relacionamentos",fonte:"Thompson — material do curso",teoria:"Bons relacionamentos criam confiança — e confiança modera as tentativas extremadas de exigir valor. Mesmo em agendas apertadas, encaixe um ou dois minutos de conversa genuína antes do negócio: a pesquisa mostra que a conversa informal promove colaboração. O rapport é a faceta imediata do relacionamento: a harmonia e a sintonia do momento, que permitem que a comunicação flua. Relacionamento se constrói entre as negociações, não só durante elas.",insight:"No mercado fornecedor de uma categoria as mesmas empresas se reencontram por anos — em RFPs, renovações e revisões de preço. Cada mesa é também um investimento (ou um saque) na conta de relacionamento das próximas dez."},{id:"tat3",t:"3. Ceticismo saudável",fonte:"Thompson — material do curso",teoria:"Confiar não é o oposto de verificar. Mesmo em relações de confiança, mantenha algum ceticismo sobre os motivos e as reivindicações da outra parte — números de mercado, prazos prometidos, maturidade tecnológica declarada. O ceticismo saudável não é hostilidade: é a disciplina de tratar afirmações como hipóteses até que venham acompanhadas de evidência.",insight:"Em proposta de fornecedor, todo número é hipótese até documentado. Peça a fonte com curiosidade, não com acusação — uma pergunta calibrada ('como vocês chegaram a esse percentual?') verifica sem ofender."},{id:"tat4",t:"4. Proteja-se",fonte:"Thompson — material do curso",teoria:"Três camadas de proteção antes e durante o acordo: avalie a reputação da contraparte (histórico, referências de mercado, passivos públicos); peça certificados e declarações de outras empresas com quem ela trabalhou; e inclua mecanismos de proteção contratual — garantias, seguros, penalidades, condições de performance. Proteção não é desconfiança declarada: é arquitetura de contrato.",insight:"Em contratos, a proteção natural são as garantias, os marcos de entrega e as condições de rescisão e de não renovação: se o serviço não atingir o combinado, o contrato encerra pelo rito previsto — combinado antes, executado sem drama."},{id:"tat5",t:"5. Cultive a reciprocidade",fonte:"Cialdini · Thompson — material do curso",teoria:"Nunca faça uma concessão sem pedir uma em troca: concessões não correspondidas criam precedente perigoso e sinalizam presa fácil. Capitalize a norma da reciprocidade concedendo naquilo que é fácil ou menos importante para você — e valioso para o outro. E lembre as regras de como conceder: destaque as suas concessões (o que é dado em silêncio não gera crédito), defina a reciprocidade esperada, use concessões contingentes ('se vocês…, então nós…'), fracione-as e enfatize os benefícios.",insight:"Prepare antes da mesa a sua lista de moedas baratas: acesso a campo de teste, visibilidade institucional, carta de referência, flexibilidade de cronograma. São concessões de baixo custo para o contratante e alto valor para o fornecedor — o combustível das trocas que expandem o acordo."},{id:"tat6",t:"6. Capitalize o poder da prova social",fonte:"Cialdini — material do curso",teoria:"Quando estamos incertos, procuramos os outros para orientação — é o instinto que faz a fila na porta do restaurante parecer atestado de qualidade. Na negociação, transmita a popularidade de uma opção: clientes satisfeitos, parceiros que renovaram, a força da marca, o histórico do programa. A prova social reduz a percepção de risco da contraparte sem que você precise argumentar diretamente.",insight:"O portfólio de pilotos já executados pelo programa é prova social institucional: 'esta estrutura de marcos é a mesma que aplicamos nos últimos cinco contratos da carteira' encerra discussões que dez argumentos não encerrariam."},{id:"tat7",t:"7. Empatia tática",fonte:"Voss — material do curso",teoria:"Mostre-se genuinamente interessado nos motivos, objetivos, desejos e emoções do outro lado — sem confundir com simpatia ou compaixão. Empatia tática não é concordar: é compreender deliberadamente, porque para influenciar a perspectiva e a decisão de alguém é preciso primeiro entender de onde ela vem. A conexão autêntica reduz a reatividade da contraparte e constrói a influência baseada em confiança — a mais durável e de menor manutenção.",insight:"Compreender não cede nada: você pode entender profundamente a pressão de caixa do fornecedor e ainda assim manter a régua do contrato. Compreender primeiro torna o 'não' seguinte muito mais aceitável."},{id:"tat8",t:"8. Inteligência conversacional",fonte:"Voss — material do curso",teoria:"Evite o seu tópico favorito — nele você falará demais e ouvirá de menos. Faça perguntas sobre o que o outro lado falou: pessoas adoram falar de si, e cada resposta é informação de preparação que você não tinha. Resuma para confirmar e aprofundar: 'então você acha que…', 'então, o que você está dizendo é…'. Ouvir é a parte crucial — e é sistematicamente a que os negociadores admitem menos praticar.",insight:"Meta concreta para a primeira reunião de uma renegociação: a equipe fala menos de 40% do tempo, e o fornecedor apresenta o cost breakdown completo antes de qualquer contraproposta entrar na mesa."},{id:"tat9",t:"9. Espelhamento",fonte:"Voss — material do curso",teoria:"Repita, com curiosidade genuína na voz, as duas ou três últimas palavras faladas pelo interlocutor — e silencie. O espelho convida o outro a prosseguir, elaborar, explicar: é a arte de permitir que a outra parte continue falando. Use-o para construir relacionamento, extrair informação, engajar e fomentar acordo. Como diz a máxima: pessoas interessantes são pessoas interessadas.",insight:"Acione o espelho quando ouvir um termo vago e carregado. 'Isso é arriscado para nós.' — 'Arriscado?' Três segundos de silêncio depois, você saberá qual risco de verdade está na cabeça deles."},{id:"tat10",t:"10. Rótulos",fonte:"Voss — material do curso",teoria:"Rotule verbalmente a emoção e a dinâmica que você observa: 'parece que você…', 'sinto que…', 'acho que…'. Nunca 'o que estou ouvindo é…' — o foco escorrega para você. Depois do rótulo, não complemente: silencie e deixe o efeito ocorrer; a simplicidade confere elegância. O rótulo neutraliza emoções negativas ao nomeá-las, coleta informação e constrói relacionamento — e a combinação clássica é rótulo seguido de pergunta calibrada: 'parece que vocês estão sob muita pressão de prazo. O que está por trás desse cronograma?'.",insight:"Quando a tensão subir na mesa, rotule o elefante: 'parece que esse ponto é o mais sensível para vocês'. Nomear a tensão a reduz — e derruba a resistência antes que ela contamine a pauta inteira."},{id:"tat11",t:"11. Uso da voz",fonte:"Voss — material do curso",fig:"voz",teoria:"Três vozes, três funções. A assertiva/ríspida é um soco no nariz: quase sempre contraproducente, ativa a raiva do outro lado. A acomodadora/lúdica — falada com um sorriso — carrega verdades pronunciadas suavemente e convida à colaboração: é a voz de ~80% do tempo. A pausada — direta, com cadência suave e descendente — é reservada aos pontos inegociáveis: 10 a 20% do tempo. E atenção às inflexões: a interrogativa (curiosidade genuína) deve ser o padrão; a declarativa, exceção para fatos.",insight:"Reserve a voz pausada para as réguas do programa — orçamento-teto, caráter inovador, prazos regulatórios. Dita nessa voz, a régua soa inegociável sem que você precise dizer a palavra 'inegociável'."},{id:"tat12",t:"12. Comunicação digital",fonte:"Material do curso — Prof. Thiago Lima",teoria:"Não jogue xadrez por e-mail. O texto escrito perde tom, perde contexto, congela posições e transforma cada mensagem em documento — e ninguém faz concessão por escrito. Pontos sensíveis, divergências e negociação de termos pedem voz ou vídeo, onde rótulos, espelhos e uso da voz funcionam. O e-mail tem um papel nobre e um só: registrar com precisão aquilo que já foi combinado.",insight:"Regra prática da equipe: se a resposta a um e-mail exigir mais de dois parágrafos de argumentação, não responda — ligue. Depois da ligação, aí sim, o e-mail registra o combinado."},{id:"tat13",t:"13. Regra 7-38-55",fonte:"Mehrabian, Wiener & Ferris (1967) · Collins, Minson, Kristal & Brooks (2024)",fig:"t73855",teoria:"O clássico: a partir de dois estudos de 1967 na UCLA, atribuiu-se às três grandes áreas da comunicação emocional os pesos de 7% (conteúdo das palavras), 38% (tom de voz) e 55% (linguagem corporal). Vale saber o que os estudos originais realmente mediram: reações a palavras isoladas em situações de mensagem contraditória — não a comunicação corrente de uma mesa de negociação. Daí a regra ser tão citada quanto extrapolada. A atualização vem por outro caminho, e é mais útil: Collins, Minson, Kristal e Brooks (2024), em cinco experimentos com 1.225 participantes, mostraram que os sinais não verbais e paralinguísticos que associamos à escuta — sorrir, acenar com a cabeça, inclinar-se à frente — são péssimos indicadores de atenção real, porque são facilmente simulados e efetivamente usados para simular. Quem fala acerta em cerca de 70% das vezes ao julgar se está sendo ouvido; erra em 30%. A lição para a mesa inverte o senso comum: cuide do seu tom, porque ele afeta o outro — mas não confie na leitura dos sinais dele para saber se foi compreendido.",insight:"Nos três primeiros minutos de uma call difícil, o como importa: voz calma, cadência descendente, sem pressa. Mas não deduza compreensão do aceno de cabeça da contraparte — verifique com palavras: “o que ficou claro até aqui?” ou “o que disso faz sentido para vocês?”. Em videoconferência, onde os sinais já chegam degradados, essa verificação verbal deixa de ser cortesia e vira método."},{id:"tat14",t:"14. Perguntas calibradas",fonte:"Voss — material do curso",teoria:"Perguntas abertas iniciadas por 'o que' ou 'como', estruturadas para dar à outra parte a ilusão do controle — ela responde sentindo que conduz, enquanto reflete e fornece informações do seu interesse. Evite o 'por quê': ativa a defesa, soa a acusação; substitua por 'o que torna necessário…'. Exemplos de mesa: 'o que torna necessário entregar em duas semanas?', 'como vocês fizeram esse negócio no passado?', 'como sei que vocês cumprirão os prazos?' — e a joia da coroa, quando a exigência é inviável: 'como vou fazer isso?'.",insight:"Transforme cada exigência recebida em pergunta calibrada em vez de recusa. 'Precisamos de exclusividade' → 'o que a exclusividade resolve para vocês?' Quem responde está trabalhando para você — e quase sempre revela o interesse real atrás da posição."},{id:"tat15",t:"15. Auditoria de acusações",fonte:"Voss — material do curso",teoria:"Antes da conversa, liste de forma abrangente as suposições negativas e os sentimentos que o outro lado pode ter contra você — e antecipe-se, verbalizando-os primeiro: 'você vai achar que não estamos sendo transparentes…', 'pode parecer que estamos ganhando tempo…'. Emoções negativas não expressas nunca morrem: ficam no subterrâneo da mesa, contaminando tudo. Ir atrás delas antes que apareçam desarma a acusação — dita por você, ela perde o veneno.",insight:"Antes de comunicar uma régua dura do RFP ou da política de compras a um fornecedor ansioso, abra com as três críticas prováveis: 'vocês vão achar que é burocracia, que trava o cronograma e que a regra não faz sentido para o caso de vocês…'. O que sobrar depois disso é conversa técnica."},{id:"tat16",t:"16. O poder do não",fonte:"Voss — material do curso",teoria:"Inverta as perguntas que provocam o 'sim': 'você concorda com isso?' vira 'você discorda?'; 'faz sentido?' vira 'é um momento ruim para falarmos?'. O 'sim' arrancado compromete — e por isso as pessoas o defendem com reservas mentais. No 'não', ao contrário, sentimo-nos seguros e protegidos, sem compromisso assumido: e é dessa segurança que flui informação honesta.",insight:"Com uma contraparte evasiva, teste o não: 'seria inviável para vocês começar o piloto em março?'. Um 'não, inviável não é…' abre a conversa real que cinco 'sins' educados vinham escondendo."},{id:"tat17",t:"17. Explore a aversão à perda",fonte:"Kahneman · Voss — material do curso",teoria:"A perda pesa mais que o ganho equivalente — é o fator dominante da decisão humana, e o medo da perda é o que mantém as pessoas acordadas de madrugada. Qualquer situação pode ser enquadrada como ganho ou como perda: 'este investimento rende 15%' e 'não investir custará 15%' descrevem o mesmo fato e produzem decisões diferentes. Apresente as situações sob o prisma da perda quando quiser mobilizar — com ética: enquadre perdas reais, não fabrique ameaças.",insight:"No argumento interno por uma posição dura diante de um pedido de reajuste, o enquadramento de perda é legítimo e poderoso: o custo de ceder sem demonstração — precedente que contamina as demais categorias, margem consumida sem contrapartida, dependência aprofundada — decide posições que a promessa de economia não decide."},{id:"tat18",t:"18. Método de Ackerman",fonte:"Voss — material do curso",fig:"ackerman",teoria:"Um sistema de oferta-contraoferta com incrementos decrescentes. Defina o alvo e oferte 65% dele; suba para 85%, depois 95% — e feche em um número quebrado e não redondo (97,27, não 100), acompanhado de uma vantagem não monetária. Os incrementos que encolhem comunicam, sem palavras, que o seu limite se aproxima; o número quebrado sinaliza cálculo real, não chute; e o gesto final não monetário permite ao outro lado fechar sentindo que extraiu tudo.",insight:"Guarde deliberadamente uma concessão não monetária para o lance final — visibilidade no programa, flexibilidade de marco, acesso a campo de teste. É ela que transforma o último número na sensação de vitória da contraparte."},{id:"tat19",t:"19. Método da ancoragem",fonte:"Voss · Kahneman — material do curso",fig:"ancoragem",teoria:"A primeira proposta, por mais arbitrária que seja, serve de âncora para toda a transação: quem joga primeiro define os parâmetros da conversa. A decisão de ancorar ou esperar depende do seu grau de certeza. Se você conhece bem o valor do que negocia, faça a primeira oferta — sustentada por critérios objetivos, para a âncora nascer legítima. Se há muitas incertezas, troque informações antes de qualquer número. E defenda-se das âncoras alheias: reconheça o número como âncora, não como referência, e reancore com critérios.",insight:"Em categoria madura, ancore você — com o should-cost e o histórico de preços da categoria. Diante de objeto inédito, inverta: 'antes de falar de valores, o que compõe a estrutura de custos de vocês?'. Informação primeiro, número depois."},{id:"tat20",t:"20. Conclua de forma positiva",fonte:"Material do curso — Prof. Thiago Lima",teoria:"A última impressão propaga a próxima interação: o fechamento é a parte da reunião que a memória da contraparte guardará. Encerre com palavras positivas e colaborativas — 'estamos aqui porque queremos que nossos parceiros prosperem fazendo negócios conosco' — mesmo quando o resultado do dia foi um impasse. Acordo se celebra; impasse se encerra com a porta aberta.",insight:"O mercado é menor do que parece e as empresas se reencontram: o fornecedor preterido hoje pode ser o único habilitado amanhã. Um 'não' bem encerrado é ativo de relacionamento; um 'não' mal encerrado circula no mercado."}]},{id:"cxr",curto:"Complexidade e risco",sec:"Complexidade, risco e portfólio",topicos:[{id:"vcapteoria",t:"VCAP: valor como produto, não como soma",fonte:"LIMA, Thiago — Excelência Operacional: da Estratégia à Execução (Atena Editora, 2026)",fig:"vcapfig",teoria:"V = C × (A + P) organiza quatro elementos: Valor é o resultado; Ativos são o que a organização tem — equipamentos, dados, propriedade intelectual, instalações; Processos são como ela opera — fluxos, métodos, rotinas de decisão; e Capacidades são o que ela sabe fazer de forma repetida e confiável. A estrutura importa tanto quanto os termos. Ativos e processos se somam: são recursos que se acumulam e se substituem parcialmente. Capacidades multiplicam: elas determinam quanto daquele estoque de recursos vira resultado. E o que a multiplicação diz, na prática, é duro: se a capacidade é zero, o valor é zero, por maiores que sejam os ativos e por melhores que sejam os processos. Comprar equipamento sem saber operá-lo, instalar um sistema sem mudar o modo de decidir, contratar um serviço sem absorver o método — em todos esses casos há despesa e não há valor durável.",insight:"Numa compra, o VCAP é o teste do contrato: ao fim dele, a organização sabe fazer algo que não sabia antes? Consumir serviço sem internalizar capacidade — de especificar, medir e auditar — deixa o comprador refém na renovação; e isso muda tanto o argumento de valor quanto a posição negocial futura."},{id:"cynefinteoria",t:"Cynefin: em que domínio você está decidindo?",fonte:"SNOWDEN, David J.; BOONE, Mary E. — A Leader's Framework for Decision Making, Harvard Business Review, novembro de 2007",fig:"cynefin",teoria:"O Cynefin não classifica problemas por dificuldade, e sim pela natureza da relação entre causa e efeito — o que determina qual método de decisão funciona. No domínio Claro, causa e efeito são evidentes a todos: percebe-se, categoriza-se e responde-se por procedimento; existe melhor prática. No Complicado, a relação existe mas exige análise: percebe-se, analisa-se e responde-se; existe boa prática, e especialistas são úteis. No Complexo, a relação só fica clara em retrospecto: não há como analisar antes, é preciso sondar — experimentos seguros para falhar —, perceber o que emerge e então responder; a prática é emergente. No Caótico não há relação discernível: age-se primeiro para estancar, depois percebe-se e responde-se. E há um quinto estado, a Confusão: não se sabe em qual domínio se está — o mais perigoso, porque cada um decide segundo o domínio em que se sente confortável. Contratação de desenvolvimento, por definição, vive no Complexo.",insight:"O erro mais caro é aplicar ferramentas de Complicado a um problema Complexo: contratar desenvolvimento exploratório com escopo fechado, especificação exaustiva e cronograma rígido, como se fosse serviço comum. O antídoto contratual é o que a boa gestão de contratos já pratica — marcos, pagamentos por entrega verificada e condições de encerramento: são a forma jurídica do “sondar, perceber, responder”."},{id:"batnacomplexo",t:"BATNA e ZOPA sob complexidade",fonte:"Aplicação do curso — Prof. Thiago Lima · sobre Snowden & Boone (2007) e Fisher, Ury & Patton",teoria:"Os conceitos de posição — BATNA, preço de reserva, ZOPA — foram formulados para negociações onde é possível pesquisar e estimar: o domínio Complicado. Ali eles são valores a descobrir, e a preparação consiste em descobri-los bem. No domínio Complexo — contratações de desenvolvimento, objetos inéditos —, eles mudam de estatuto: deixam de ser valores a descobrir e passam a ser hipóteses a testar. A tecnologia pode se revelar melhor ou pior do que o previsto; o mercado pode não existir; a sua própria alternativa pode se fortalecer com uma carta de intenção ou evaporar com uma mudança de orçamento. Consequentemente, a ZOPA pode não existir no início e ser criada pelo aprendizado das primeiras rodadas — quando as partes descobrem que o que era caro para uma é barato para a outra. Isso não dispensa a preparação; ao contrário, exige que ela seja datada. Registre a hipótese, o grau de confiança e o que você aprendeu que a modifica.",insight:"Em negociação multi-rodada — um RFP em etapas, uma revisão de preço, uma renovação —, trate o caderno como documento vivo: depois de cada encontro, reabra os blocos de BATNA e de posição de desistência e pergunte o que mudou. Uma BATNA de três meses atrás, num projeto complexo, é um número velho com aparência de certeza."},{id:"kraljic",t:"Matriz Kraljic: o portfólio de fornecedores",fonte:"KRALJIC, Peter — Purchasing Must Become Supply Management, Harvard Business Review, 1983 · LIMA, Thiago — Contratação e Gestão de Fornecedores Estratégicos (Atena Editora, 2026)",fig:"kraljic",teoria:"A matriz classifica itens e fornecedores em dois eixos: o impacto — no resultado, no custo, na operação — e o risco de suprimento, que reúne complexidade do mercado fornecedor, escassez, dependência técnica e dificuldade de substituição. Da combinação saem quatro quadrantes com posturas de negociação distintas. Não críticos, de baixo impacto e baixo risco: o objetivo é reduzir o custo do processo — simplificar, automatizar, comprar por catálogo. Alavancagem, de alto impacto e baixo risco: há muitos fornecedores capazes, então a competição é legítima e o preço é o campo de disputa. Gargalo, de baixo impacto e alto risco: o valor em jogo é pequeno, mas a falta para a operação — garante-se fornecimento com contrato de disponibilidade, estoque ou busca de substitutos. Estratégicos, de alto impacto e alto risco: poucos fornecedores capazes e muita coisa dependendo deles — a postura é de parceria, desenvolvimento conjunto e relação longa. O valor da matriz não é a classificação em si: é impedir que se use a postura de um quadrante no quadrante errado.",insight:"Um fornecedor único de serviço crítico cai no quadrante Estratégico: alto impacto e alto risco de suprimento, porque há poucos capazes de entregar aquilo e a operação depende dele. Tratá-lo com postura de Alavancagem — apertar preço, colocar concorrentes para brigar — destrói exatamente a relação de que o projeto precisa. O erro inverso também existe: transformar em parceria estratégica um fornecedor que é de alavancagem, e pagar caro por isso."},{id:"complexrisco",t:"Complexidade é escolha — e ela cobra em risco",fonte:"HENDRICKS, Kevin B.; SINGHAL, Vinod R. (2003; 2005) · LIMA, Thiago — A Interface entre Supply Chain e Finanças Corporativas (Atena Editora, 2026)",fig:"complexrisco",teoria:"Boa parte da complexidade de uma operação não é imposta pelo ambiente: é escolhida por nós, uma decisão de cada vez. Cada fornecedor adicional, cada variante de produto, cada geografia nova de suprimento, cada tecnologia com uma interface a mais — todas compram alguma coisa (preço melhor, redundância, capacidade nova) e todas cobram alguma coisa: mais pontos de falha, mais custo de coordenação, mais variância no resultado e menos margem para erro. O problema é que o benefício aparece no contrato assinado e o custo aparece depois, difuso, como risco. E esse custo é mensurável. Hendricks e Singhal, analisando 519 anúncios de falhas de cadeia entre 1989 e 2000, encontraram queda anormal média de 10,3% no valor ao acionista na data do anúncio; num estudo posterior com 827 anúncios de disrupções, mediram retorno anormal acumulado próximo de −40% na janela que vai de um ano antes a dois anos depois, com as empresas não se recuperando rapidamente — e risco de mercado 13,5% maior no ano seguinte ao evento. Ou seja: a complexidade mal escolhida não deprime só o resultado; ela reprecifica a empresa.",insight:"Antes de fechar qualquer acordo que adicione um fornecedor, uma geografia ou uma variante, faça as três perguntas dos tópicos anteriores: que capacidade isso constrói (VCAP)? em que quadrante esse fornecedor está (Kraljic)? e em que domínio essa decisão é tomada (Cynefin)? Se a resposta for “nenhuma capacidade nova, quadrante de alavancagem, domínio complicado”, então o que se está comprando é exposição com aparência de estratégia."}]},{id:"vc",curto:"Strategic Sourcing",sec:"Strategic Sourcing — do portfólio à mesa",topicos:[{id:"quadro",tipo:"quadro",t:"Quadro de referência: o vocabulário do strategic sourcing na mesa",fonte:"Prof. Dr. Thiago Lima · Kraljic (1983) · Ellram (1993) · Monczka et al. · Van Weele",teoria:"Cada termo aparece com seu significado consagrado no método de sourcing e com a implicação correspondente na mesa de negociação, distribuído em três posições: estratégia de sourcing, contrato e relacionamento, e leitura do fornecedor.",insight:"Antes de usar qualquer termo deste módulo numa reunião, verifique em que posição ele está. Tratar como negociável o que a estratégia de categoria já decidiu gera concessão sem mandato; tratar como decidido o que ainda está aberto desperdiça um espaço negocial que já está à mão."},{id:"quadrante",pos:["direta"],t:"Do quadrante à mesa: quatro categorias, quatro negociações",fonte:"Kraljic (1983) · Gelderman & Van Weele (2003) — leitura do curso",teoria:"A matriz não é um exercício de classificação: é o mapa das mesas. Itens não críticos pedem eficiência de processo — catálogo, cartão, pedido automático — e quase não pedem mesa. Itens de alavancagem pedem competição: volume consolidado, RFQ ou leilão, fornecedores intercambiáveis e postura firme em preço, porque a alternativa é real. Itens de gargalo invertem a lógica: o poder está com o fornecedor, e a mesa é sobre garantia de suprimento, contratos mais longos, estoque de segurança e, sobretudo, sobre sair do quadrante — redesenhar a especificação, qualificar fonte alternativa. Itens estratégicos pedem relacionamento: negociação conjunta de valor, transparência de custos, planos de desenvolvimento e governança executiva. O erro clássico é aplicar a postura de alavancagem a todos os quadrantes: funciona onde há alternativa e destrói valor onde não há.",insight:"Para cada negociação da carteira de vocês, responda antes: em que quadrante está esta categoria — e a postura que estou levando à mesa é a desse quadrante? Gelderman e Van Weele lembram que o movimento entre quadrantes é a decisão estratégica: negociar melhor dentro do quadrante é tático; mudar de quadrante é estratégico.",taesa:"O comprador reconhece o quadrante em segundos; a organização, não. Leve a matriz para a reunião de alinhamento interno antes de levar a proposta ao fornecedor — o mandato que a área técnica e a diretoria dão ao negociador depende de concordarem sobre onde a categoria está."},{id:"processo",pos:["direta"],t:"O processo de sourcing como arquitetura da negociação",fonte:"Monczka, Handfield, Giunipero & Patterson — Purchasing and Supply Chain Management · aplicação do curso",teoria:"O sourcing estratégico é uma sequência — análise de gasto, análise de mercado, estratégia de categoria, RFI, RFP ou RFQ, avaliação, shortlist, negociação, BAFO, contrato, implantação — e cada etapa é uma decisão de desenho negocial. O RFI qualifica e informa sem comprometer; o RFP abre espaço para solução e valor, mas obriga a definir os critérios de avaliação antes de as propostas chegarem; a shortlist mantém a competição viva enquanto a conversa se aprofunda; a BAFO fecha sob regras iguais. Quem domina o processo domina a mesa: a Regra de Ouro do curso vale aqui literalmente — o comprador escreve as regras, o calendário e a base de comparação. A geometria dessa mesa é particular: a alternativa está sentada na sala ao lado, o critério está publicado e o prazo é seu.",insight:"Defina os pesos da avaliação — técnica, TCO, risco, capacidade — e a matriz de comparação antes de abrir o RFP, com a área técnica assinando junto. Critério definido depois de ler as propostas é critério moldado pela proposta mais persuasiva.",taesa:"Não deixe a negociação para depois da BAFO: esclarecimentos, visitas técnicas e rodadas de perguntas são mesas — informais, mas mesas. É nelas que o fornecedor revela estrutura de custos, capacidade ociosa e interesse real; a BAFO apenas registra o que essas conversas construíram."},{id:"tco",pos:["direta","modulo3"],t:"TCO e should-cost: o critério objetivo do comprador",fonte:"Ellram (1993) · Fisher, Ury & Patton (critérios objetivos) — aplicação do curso",teoria:"Harvard recomenda negociar sobre critérios independentes da vontade das partes. Na compra, esses critérios têm nome: TCO — custo total ao longo do ciclo, da aquisição ao descarte — e should-cost — a estimativa própria do que o item deveria custar, construída por engenharia e dados de mercado. O TCO desloca a conversa de preço unitário para custo de vida: frete, qualidade, tempo de implantação, custo de falha, custo de troca. O should-cost dá ao comprador a planilha própria sem a qual ele negocia sobre a planilha do outro — e negociar no documento da contraparte é aceitar cada âncora que não construiu. A combinação dos dois converte a mesa: em vez de «dá para melhorar o preço?», pergunta-se «qual componente do seu custo muda se ajustarmos lote, especificação ou prazo?».",insight:"Construa o modelo de TCO antes de receber as propostas e compartilhe a estrutura — não os valores — com os proponentes: quem define a base de comparação define o resultado. E monte o should-cost das três linhas de maior peso: raramente vale abrir as demais.",taesa:"Preço unitário mais baixo com prazo de implantação maior, qualidade menor ou dependência maior costuma ser a proposta mais cara. Quando a área solicitante pressionar por «o menor preço», leve o TCO em uma página: é o argumento de que ela precisa para defender a decisão internamente."},{id:"poder",pos:["leitura","direta"],t:"Poder na mesa: ler a estrutura do mercado antes de escolher a postura",fonte:"Cox (2001) — Understanding buyer and supplier power · Kraljic (1983) — leitura do curso",teoria:"Poder de barganha não é atributo do negociador: é função da estrutura — quantos fornecedores capazes existem, quanto o seu volume representa para eles, quanto custa trocar de lado a lado, quem detém a especificação, a tecnologia ou a marca. Cox descreve quatro regimes: dominância do comprador, dominância do fornecedor, interdependência e independência — e a postura que funciona em um destrói valor em outro. Firmeza sem alternativa é blefe, e fornecedor experiente reconhece blefe. Colaboração sem interdependência real é ingenuidade, e fornecedor experiente cobra por ela. Ler o regime é o primeiro ato de preparação; alterá-lo — qualificar segunda fonte, reduzir custo de troca, consolidar volume, padronizar especificação — é o trabalho de portfólio que muda o resultado de todas as mesas seguintes.",insight:"Responda por escrito, antes da primeira reunião: que fração da receita deles somos nós? Que fração do nosso gasto na categoria são eles? Quanto custa, em meses e em reais, trocar? Quem tem a alternativa mais crível? A resposta define a postura — e mostra onde investir para mudá-la.",taesa:"Interdependência é a melhor mesa: quando os dois lados precisam um do outro, a conversa é sobre valor conjunto e as táticas duras saem de cena. Quando a dependência é só sua, o objetivo da negociação atual pode ser menos o preço de hoje e mais as cláusulas que reduzem a dependência amanhã."},{id:"srm",pos:["modulo3"],t:"Fornecedor estratégico: negociar o relacionamento, não o pedido",fonte:"Liker & Choi (2004) — Building deep supplier relationships, HBR · aplicação do curso",teoria:"Com o fornecedor estratégico, a unidade da negociação não é o pedido nem o contrato: é a relação de vários anos, com governança própria — executivos-padrinho, reuniões de desempenho, planos de desenvolvimento conjunto, transparência de custos, ganho compartilhado. Liker e Choi descrevem o modelo das montadoras japonesas nos Estados Unidos: fornecedores que abrem custos, aceitam metas de redução e investem em capacidade específica porque confiam em reciprocidade de longo prazo — e que, por isso, entregam inovação que o comprador transacional nunca vê. A mesa, aqui, tem memória: cada concessão arrancada hoje é um saque na conta do relacionamento; cada problema resolvido em conjunto é um depósito. A tensão cooperar × competir não se resolve — administra-se, e o instrumento é o contrato: cláusulas de open book com regras claras, ganho compartilhado com fórmula, metas com governança.",insight:"Antes de negociar com um fornecedor estratégico, escreva o que vocês querem que ele invista — capacidade, engenharia, tecnologia — e o que ele precisa ver para investir: horizonte, volume, previsibilidade, reciprocidade. Essa é a troca de fundo; o preço é consequência.",taesa:"Open book sem regra de partilha de ganhos é pedido de confiança unilateral, e o fornecedor sabe disso. Proponha a fórmula junto com o pedido de abertura: «vocês abrem, a redução que encontrarmos juntos se divide assim» — a transparência vira negócio, não favor."},{id:"risco",pos:["modulo3","direta"],t:"Risco de suprimento: a BATNA que se constrói no portfólio",fonte:"Hendricks & Singhal (2003, 2005) · LIMA, Thiago — A Interface entre Supply Chain e Finanças Corporativas · aplicação do curso",teoria:"A BATNA de uma negociação de compras raramente nasce na mesa: nasce no desenho da base de fornecimento. Fornecedor único com ferramental próprio, especificação fechada e custo de troca alto produz uma negociação em que a alternativa não existe — e sem alternativa não há posição, há pedido. Dual sourcing com divisão de volume por desempenho, ferramental de propriedade do comprador, dados portáveis, estoque estratégico do item crítico e fornecedor alternativo qualificado, ainda que inativo, são investimentos que valem exatamente o que devolvem em poder de barganha nas mesas seguintes. Hendricks e Singhal mostram o custo do outro lado da conta: rupturas de suprimento destroem valor ao acionista de forma persistente. A gestão de risco não é custo de compras — é a engenharia da BATNA.",insight:"Para cada categoria de gargalo ou estratégica, mantenha um plano de continuidade escrito e um fornecedor alternativo qualificado. Não é preciso anunciá-lo: a contraparte percebe pelo processo — pela visita técnica que vocês fizeram, pelo lote-piloto que compraram.",taesa:"A pergunta «o que acontece se este fornecedor parar amanhã?» é a melhor ferramenta de preparação para a renovação: se a resposta é «paramos também», o objetivo desta negociação é reduzir a dependência, mesmo que custe preço."},{id:"etica",pos:["direta","modulo3"],t:"A mesa do comprador: integridade, equidade entre proponentes e reputação",fonte:"Cialdini (reciprocidade) · Thompson (senso de justiça) · códigos de conduta de compras — aplicação do curso",teoria:"O comprador negocia com o dinheiro da organização e em nome dela, diante de fornecedores que se reencontram por anos e conversam entre si. Três consequências. Primeira: a reciprocidade opera contra o comprador — presentes, convites e favores criam dívida psicológica que a política de compras existe para neutralizar; recuse com naturalidade e explique a regra, não a pessoa. Segunda: a equidade entre proponentes é ativo, não burocracia — processo percebido como justo atrai fornecedores melhores e propostas mais honestas na próxima rodada; vazar informação de um proponente para outro compra um desconto e vende a credibilidade do processo inteiro. Terceira: registro protege os dois lados — atas, e-mails de confirmação e critérios publicados fazem a negociação sobreviver à troca de pessoas de ambas as partes.",insight:"Escreva cada concessão na forma em que ela entrará no contrato: «concedido X, limitado a Y, condicionado a Z, em troca de W». Se a frase não se sustenta escrita para o comitê, a concessão não se sustenta feita.",taesa:"A pergunta-guia do comprador não é «consigo defender isso na mesa?», e sim «consigo defender isso na auditoria, daqui a dois anos, para quem só tiver os documentos?». Quando a resposta é sim, a mesa fica leve — e o fornecedor sente."}]}],Qm=Ut.flatMap(e=>e.topicos),rc={vcapfig:"Se C = 0, então V = 0: comprar ativos e instalar processos sem construir capacidade não deixa valor durável.",cynefin:"Contratações de desenvolvimento vivem no domínio Complexo. O erro comum — e caro — é aplicar ferramentas de Complicado, como plano detalhado e escopo fixo, a um problema Complexo.",complexrisco:"A pergunta de mesa: o que esta complexidade compra — e compra mais do que o risco que ela adiciona?",kraljic:"Eixos conforme a aula: impacto na vertical, risco de suprimento na horizontal. O valor da matriz não é a classificação em si, e sim impedir que se use a postura de um quadrante no quadrante errado.",voz:"Inflexão padrão: interrogativa, de curiosidade genuína. A declarativa fica para os fatos; a assertiva, quase sempre contraproducente, é a que se evita.",ackerman:"A oferta final leva número quebrado e ímpar, acompanhada de uma vantagem não monetária — é ela que permite ao outro lado fechar sentindo que extraiu tudo.",t73855:"Percentuais de Mehrabian (1967), medidos em comunicações emocionais com mensagem contraditória — não em conversa corrente. Ver a atualização de Collins e colegas (2024).",liqpref:"Na venda moderada, que é a mais comum, a cláusula decide milhões. Na venda fraca, decide tudo.",antidil:"Mesmo evento, seis vezes de diferença: toda a diluição extra recai sobre fundadores e funcionários.",powerlaw:"Uma única empresa responde por 89% do retorno do fundo — é isso que explica a urgência e a pressão do fornecedor do outro lado da mesa.",zopa:"Sem sobreposição entre as duas posições de desistência não há ZOPA — a menos que novas variáveis entrem na mesa.",tranches:"Cada tranche compra o direito, não a obrigação, de continuar. Se a tecnologia não performar, as partes se separam sem litígio: a saída estava combinada desde o início.",diluicao:"Ana e Bruno continuam com 500.000 ações cada. O percentual muda porque o bolo cresceu — diluição só é ruim quando o pedaço encolhe mais do que a empresa cresce.",runway:"Abaixo de seis meses de autonomia, a contraparte aceita quase qualquer condição — e é justamente por isso que ela vira risco de execução do projeto."},Vm={background:wa,border:`1px solid ${zo}`,borderRadius:6,padding:"10px 12px",margin:"0 0 12px"},C={fontFamily:Te,fontSize:12,fill:Aa},E={fontFamily:Te,fontSize:12.5,fontWeight:700,fill:N},tc={equacao:t.default.createElement("svg",{viewBox:"0 0 560 180",width:"100%",role:"img","aria-label":"Equação da Influência"},t.default.createElement("text",{x:"8",y:"98",style:{...E,fontSize:15}},"Influência ="),[{x:110,t1:"Interesses",t2:"atendidos"},{x:263,t1:"Raciocínio",t2:"lógico"},{x:416,t1:"Relacionamento",t2:"confiança"}].map((e,o)=>t.default.createElement("g",{key:o},t.default.createElement("rect",{x:e.x,y:"26",width:"135",height:"46",rx:"6",fill:"#fff",st

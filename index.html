sso",sub:"guardam a sua posição"}],dc=[{n:1,g:"res",t:"Senso de justiça",d:"o sentimento de injustiça pode arruinar acordos"},{n:2,g:"rel",t:"Cuide dos relacionamentos",d:"bons relacionamentos criam confiança"},{n:3,g:"pro",t:"Ceticismo saudável",d:"desconfie"},{n:4,g:"pro",t:"Proteja-se",d:"avalie a reputação, peça certificados, inclua mecanismos de proteção contratual"},{n:5,g:"int",t:"Cultive a reciprocidade",d:"nunca faça uma concessão sem pedir uma em troca / ofereça condições mais fáceis para você"},{n:6,g:"int",t:"Capitalize o poder da prova social",d:"transmita a popularidade de uma opção"},{n:7,g:"rel",t:"Empatia tática",d:"mostre-se genuinamente interessado nos motivos e interesses do outro lado"},{n:8,g:"rel",t:"Inteligência conversacional",d:"ouça ativamente, faça perguntas sobre o que o outro lado falou: 'Então você acha que...', 'Então, o que você está dizendo é...'"},{n:9,g:"int",t:"Espelhamento",d:"execute a repetição e a indagação das últimas palavras faladas pelo interlocutor"},{n:10,g:"int",t:"Rótulos",d:"esteja consciente da emoção e da dinâmica do outro lado: 'parece que você...', 'acho que...'"},{n:11,g:"rel",t:"Uso da voz",d:"assertiva/ríspida · acomodadora/lúdica · pausada — acusatória × estimulante para reflexão"},{n:12,g:"pro",t:"Comunicação digital",d:"não jogue xadrez por e-mail"},{n:13,g:"rel",t:"Regra 7-38-55",d:"atenção com o tom da sua voz e a linguagem corporal (Mehrabian, 1967 · Collins, Minson, Kristal & Brooks, 2024)"},{n:14,g:"int",t:"Perguntas calibradas",d:"O que...? Como...? Evite o 'por que', use 'o que torna necessário...' — provoque a reflexão na outra parte"},{n:15,g:"res",t:"Auditoria de acusações",d:"pense nas suposições negativas e sentimentos que o outro lado pode ter contra você — antecipe-se: 'Você vai achar que...'"},{n:16,g:"res",t:"O poder do não",d:"inverta as perguntas que provocam o 'sim': 'Você concorda com isso?' versus 'Você discorda?'"},{n:17,g:"int",t:"Explore a aversão à perda",d:"provoque o medo da perda no outro lado — apresente as situações sob esse prisma"},{n:18,g:"int",t:"Método de Ackerman",d:"65%, 20%, 10% e proposta final com número quebrado e ímpar"},{n:19,g:"int",t:"Método da ancoragem",d:"cuidado com as âncoras / use-as a seu favor"},{n:20,g:"rel",t:"Conclua de forma positiva",d:"última impressão propaga a próxima interação"}],_t={direta:{rot:"Estratégia de sourcing",curto:"Sourcing",cor:"#0E2A47",fundo:"#E8EDF3",desc:"O termo opera antes do contrato — é o campo da análise de categoria, do desenho do processo competitivo e da escolha do fornecedor."},modulo3:{rot:"Contrato e relacionamento",curto:"Contrato",cor:"#8A6D1D",fundo:"#F1E8CB",desc:"O termo opera durante a execução — é o campo da gestão do contrato, do desempenho e do relacionamento com o fornecedor."},leitura:{rot:"Leitura do fornecedor",curto:"Leitura",cor:"#5A6B7C",fundo:"#EEF1F4",desc:"Não é ato do comprador: serve para entender a contraparte, seus custos e seu poder — e avaliar risco."}},Qt=[{t:"Matriz Kraljic",sub:"impacto no resultado × risco de suprimento",pos:["direta"],mercado:"Classifica cada categoria em quatro quadrantes — não críticos, alavancagem, gargalo e estratégicos — cruzando impacto financeiro e complexidade do mercado fornecedor. A estratégia de sourcing decorre do quadrante, não do item.",taesa:"O quadrante define a postura antes da primeira reunião: em alavancagem, competição e volume; em gargalo, garantia de suprimento vale mais que preço; em estratégico, a mesa é sobre relacionamento e valor conjunto. Negociar uma categoria de gargalo como se fosse de alavancagem é a forma mais comum de perder o fornecedor certo."},{t:"Gestão por categorias",sub:"category management",pos:["direta"],mercado:"Agrupa o gasto por mercado fornecedor, e não por centro de custo, para que cada categoria tenha estratégia, equipe e ciclo de revisão próprios.",taesa:"Categoria é o nível em que o comprador constrói poder: consolidar volume, padronizar especificação e definir a estratégia antes de abrir qualquer RFP. Quem chega à mesa negociando um pedido negocia sem o peso da categoria."},{t:"Análise de gastos",sub:"spend analysis",pos:["direta"],mercado:"Consolidação e classificação do gasto histórico por categoria, fornecedor e unidade — base para identificar concentração, fragmentação e oportunidades.",taesa:"É a primeira fonte de critério objetivo do comprador: volume real consolidado, preço pago por unidade e dispersão entre fornecedores. Sem spend analysis, o fornecedor conhece o seu gasto melhor do que você."},{t:"RFI, RFP e RFQ",sub:"os três pedidos ao mercado",pos:["direta"],mercado:"RFI colhe informação e qualifica; RFP pede solução e proposta para um problema descrito; RFQ pede preço para especificação fechada. O instrumento define quanto o fornecedor pode propor — e quanto o comprador pode comparar.",taesa:"O instrumento é a primeira decisão negocial: RFQ ancora em preço e restringe criatividade; RFP abre espaço para valor, mas exige critério de avaliação escrito antes de as propostas chegarem. Critério definido depois de ler as propostas é critério moldado pela proposta mais persuasiva."},{t:"TCO",sub:"custo total de propriedade",pos:["direta","modulo3"],mercado:"Soma de todos os custos ao longo do ciclo: aquisição, logística, implantação, operação, qualidade, manutenção, risco e descarte. Comparação legítima entre propostas só existe em base TCO (Ellram, 1993).",taesa:"TCO é o critério objetivo de Harvard na compra: desloca a conversa de preço unitário para custo ao longo da vida, e é nele que o fornecedor de preço mais alto pode ser o mais barato. Apresente o seu modelo de TCO antes do número — quem define a base de comparação define o resultado."},{t:"Should-cost e cost breakdown",sub:"o preço decomposto",pos:["direta","leitura"],mercado:"Estimativa própria do custo de produzir o item ou serviço — materiais, mão de obra, overhead, margem — construída pelo comprador a partir de dados de mercado e engenharia.",taesa:"É a planilha de contraprova do comprador: negociar sobre o cost breakdown do fornecedor sem um should-cost próprio é negociar no enquadramento do outro. A pergunta que rende é «qual componente do seu custo muda se alterarmos lote, especificação ou prazo?»."},{t:"Análise do mercado fornecedor",sub:"estrutura, concentração e poder",pos:["direta","leitura"],mercado:"Mapeamento da oferta: número de fornecedores capazes, concentração, barreiras de entrada, capacidade ociosa, custos de troca e dependência recíproca (Cox, 2001).",taesa:"Poder na mesa é função da estrutura, não do estilo: em mercado concentrado com custo de troca alto, firmeza sem alternativa é blefe. Leia a estrutura antes de definir a postura — e invista para mudá-la (qualificar segundo fornecedor, reduzir custo de troca) quando ela for desfavorável."},{t:"Single, dual e multi-sourcing",sub:"quantos fornecedores por categoria",pos:["direta","modulo3"],mercado:"Decisão sobre a base de fornecimento: um fornecedor concentra volume e relacionamento; dois ou mais distribuem risco e preservam competição, ao custo de escala e coordenação.",taesa:"É a decisão que constrói ou destrói a BATNA da próxima negociação. Single sourcing compra preço hoje e paga em poder de barganha amanhã; dual sourcing com divisão de volume por desempenho mantém a alternativa viva sem precisar anunciá-la."},{t:"BAFO e rodada final",sub:"best and final offer",pos:["direta"],mercado:"Etapa em que os finalistas do processo competitivo apresentam a proposta definitiva, após esclarecimentos e negociação, sob regras iguais e critério publicado.",taesa:"A BAFO é a mesa do sourcing por excelência: ainda há competição (a alternativa está viva), há critério publicado e há prazo. Negocie antes de pedir a BAFO — o que entrar na rodada final entra como compromisso, não como conversa."},{t:"SLA e KPIs de fornecedor",sub:"o acordo medido",pos:["modulo3"],mercado:"Níveis de serviço com indicadores, metas, forma de medição, frequência de revisão e consequências — bônus, penalidades, planos de ação, encerramento.",taesa:"SLA é a tradução contratual de «duro na questão»: a régua fica no documento, não na conversa. Negocie a forma de medir tanto quanto a meta — indicador sem método de apuração é promessa, não acordo."},{t:"SRM e segmentação de fornecedores",sub:"supplier relationship management",pos:["modulo3"],mercado:"Gestão diferenciada da base: fornecedores estratégicos recebem governança, planos conjuntos e executivos-padrinho; os demais, gestão transacional eficiente (Liker & Choi, 2004).",taesa:"Com o fornecedor estratégico, a mesa é multi-rodada por definição: cada negociação é um saque ou um depósito na conta do relacionamento. Reciprocidade, transparência de custos e ganho compartilhado valem mais que a vitória num pedido."},{t:"Contrato guarda-chuva",sub:"acordo de fornecimento · framework agreement",pos:["modulo3","direta"],mercado:"Acordo que fixa condições gerais — preços, prazos, níveis de serviço, regras de reajuste — para pedidos futuros, sem obrigação de volume fechado.",taesa:"É a arquitetura que separa a negociação grande (condições, uma vez) das pequenas (pedidos, muitas vezes). Negocie a fórmula de reajuste e as cláusulas de saída no guarda-chuva: são elas que decidem quem terá poder nas revisões."},{t:"Fórmula paramétrica de reajuste",sub:"indexação e gatilhos",pos:["modulo3"],mercado:"Cláusula que vincula o preço a índices de custo (commodities, câmbio, salário, energia) com ponderação, periodicidade e gatilhos de acionamento.",taesa:"Fórmula bem construída retira o reajuste da mesa e o devolve à planilha: o pleito deixa de ser argumento e vira cálculo. Negocie a cesta e as ponderações com o should-cost ao lado — cada índice mal ponderado é uma concessão anual automática."},{t:"Condições de pagamento e capital de giro",sub:"DPO, antecipação e desconto",pos:["direta","modulo3","leitura"],mercado:"Prazo de pagamento, desconto por antecipação, financiamento de fornecedores (supply chain finance) e seus efeitos no ciclo de caixa de ambos os lados.",taesa:"Prazo é moeda com custo diferente para cada lado — a assimetria clássica que gera valor por trocas: dias de prazo valem uma fração do custo de capital para você e podem valer muito para um fornecedor de caixa curto. Troque prazo por preço; nunca dê os dois."},{t:"Custos de troca e dependência",sub:"switching costs e lock-in",pos:["leitura","modulo3"],mercado:"Custos de mudar de fornecedor: homologação, ferramental, integração de sistemas, curva de aprendizagem, estoque de transição, risco operacional.",taesa:"Custo de troca é a variável escondida em toda renovação: o fornecedor o conhece e precifica; o comprador tende a ignorá-lo até a mesa. Meça-o antes — e negocie no contrato o que o reduz: documentação, ferramental de propriedade sua, dados portáveis."},{t:"Leilão reverso",sub:"competição em preço, ao vivo",pos:["direta"],mercado:"Evento em que fornecedores qualificados reduzem lances em tempo real sobre especificação fechada; adequado a categorias de alavancagem com oferta ampla.",taesa:"Leilão é âncora pública dinâmica: funciona onde a especificação é comparável e o mercado é competitivo; em gargalo ou estratégico, destrói relacionamento e atrai lance insustentável. Use como etapa, não como substituto da negociação — e prepare a rodada pós-leilão."}],Wm=["A coluna «No método de sourcing» resume o significado consagrado de cada termo na literatura de compras e suprimentos — Kraljic, Ellram, Monczka, Van Weele, Cox — sem substituir a política de compras de cada organização: alçadas, regras de concorrência e códigos de conduta seguem os normativos internos.","Os enquadramentos de leitura do fornecedor seguem a postura do curso: fragilidade da contraparte é risco de suprimento a mitigar no contrato, não vantagem a explorar."],ka=[{id:"desafio",t:"Escolha da negociação",curto:"Negociação",sub:"Primeiro passo: definir sobre o que vocês vão trabalhar.",teoria:"dimensoes",itens:[{tipo:"guia",t:"Situações típicas da carteira",txt:"Entre as negociações típicas da rotina de compras e supply chain estão, por exemplo: sourcing de nova categoria com RFP ou RFQ; renegociação de contrato vigente com fornecedor crítico; pedido de reajuste ou revisão de preço do fornecedor; renovação de acordo de fornecimento; consolidação de volume entre unidades; negociação de SLA e penalidades com operador logístico; acordo de desenvolvimento conjunto com fornecedor estratégico. Escolham uma negociação real — em curso ou iminente — da carteira de vocês."},{tipo:"q",id:"d1",n:1,q:"Negociação escolhida pelo grupo",ex:"sourcing de operador logístico para a distribuição regional (RFP)"},{tipo:"q",id:"d2",n:2,q:"Por que este? (relevância para a área de vocês)",ex:"é a segunda maior categoria de gasto da área, o contrato atual vence em seis meses e o desempenho do incumbente caiu"},{tipo:"guia",t:"O que considerar ao responder",txt:"O objeto e o momento: qual é exatamente a decisão em jogo — conceder, negar, condicionar? Que resultado caracterizaria sucesso — e como ele seria medido? Que áreas internas são afetadas (área solicitante, operações, financeiro, jurídico, qualidade)? Em que fase está a relação: sourcing em curso, contrato em execução, vigência perto do fim? Em que quadrante da matriz Kraljic está a categoria — e que postura isso pede? Quais políticas internas balizam o que será negociado (alçadas, regras de concorrência, código de conduta) — e o que elas vinculam ou deixam aberto? Quanto custa hoje a categoria, e qual é o TCO ou should-cost de referência — ainda que aproximadamente."},{tipo:"q",id:"d3",n:3,q:"Resumo da negociação, em cinco linhas, escrito por vocês",ex:"descrevam a situação, o resultado esperado, o quadrante da categoria e o que mudaria",rows:6},{tipo:"guia",t:"A pauta já está no processo",txt:"Boa parte da pauta já está escrita: o RFP e seus anexos, a especificação, o modelo de TCO, a matriz de avaliação, o histórico de desempenho do fornecedor atual e a análise de mercado definem o que estará sobre a mesa. Somem a eles: prazo, nível de serviço, garantias, fórmula de reajuste, condições de pagamento, plano de transição e as condições da etapa seguinte — renovação, nova concorrência ou encerramento."}]},{id:"pessoas",t:"Pessoas",curto:"Pessoas",sub:"Quem está na mesa, quem está acima dela e quem está fora — mas pode influir.",teoria:"dimensoes",itens:[{tipo:"q",id:"p1",n:1,q:"Quem estará na mesa de negociações?",ex:"nós: o gerente de categoria e o gerente de operações logísticas, com apoio de custos; do outro lado, o diretor comercial e o gerente de operações do fornecedor"},{tipo:"q",id:"p2",n:2,q:"Quem está acima dos negociadores, com influência na negociação?",ex:"a diretoria de supply chain, que aprova acima da alçada; o CFO, que assina contratos plurianuais"},{tipo:"q",id:"p3",n:3,q:"Quem não está nem ao redor da mesa, nem acima dos negociadores, mas pode vir a ter participação na negociação?",ex:"as unidades atendidas pela distribuição; o financeiro; o fornecedor incumbente, que vai reagir à troca"},{tipo:"guia",t:"Ao responder, anote também",txt:"Para cada nome: o que essa pessoa quer, o que ela teme e como tratar isso sem ceder na substância. Seja duro na questão e suave com a pessoa."}]},{id:"problemas",t:"Problemas",curto:"Problemas",sub:"O que está em jogo, que soluções existem, o que as sustenta e qual é o plano B.",teoria:"harvard",itens:[{tipo:"q",id:"q1",n:1,q:"Quais são os objetivos, as prioridades, as necessidades e as motivações a serem cumpridas?",ex:"reduzir o TCO da categoria, elevar o OTIF acima de 97% e sair da dependência do incumbente"},{tipo:"guia",t:"Façam duas colunas mentais",txt:"Os nossos objetivos, com fatos. E os da outra parte, como hipótese. Marquem com “?” o que for suposição — cada “?” vira uma pergunta a fazer na mesa. Posição é o que a pessoa quer; interesse é por que ela quer."},{tipo:"q",id:"q2",n:2,q:"Quais soluções poderiam satisfazê-los na mesa?",ex:"preço-alvo com fórmula de reajuste indexada; SLA com bônus e penalidade; contrato de 36 meses com saída por desempenho"},{tipo:"guia",t:"Uma pergunta que melhora as soluções",txt:"Que capacidade este projeto constrói? Em V = C × (A + P), se a capacidade é zero o valor é zero: contratar serviço sem desenvolver competência nova não deixa nada durável. Soluções que constroem capacidade costumam acessar orçamentos, prazos e aprovações diferentes."},{tipo:"q",id:"q3",n:3,q:"Quais justificativas poderiam apoiar as soluções que eu quero manter no negócio?",ex:"modelo de TCO da categoria; should-cost de frete por rota; propostas dos demais finalistas; benchmark de mercado"},{tipo:"guia",t:"Cuidado com a comparação",txt:"Dois números só se comparam se medirem o mesmo escopo. Antes de usar um custo como argumento, confiram o que ele inclui e o que deixa de fora."},{tipo:"q",id:"q4",n:4,q:"Qual é o meu plano B caso as negociações parem?",ex:"fechar com o segundo colocado; ou dividir a malha entre dois operadores; ou prorrogar o incumbente por seis meses com SLA revisado"},{tipo:"nota",txt:"Esta pergunta abre o Bloco 4 — a análise da BATNA."}]},{id:"processo",t:"Processo",curto:"Processo",sub:"Como a negociação vai acontecer — a dimensão mais esquecida e a mais barata de preparar.",teoria:"precee",itens:[{tipo:"q",id:"r1",n:1,q:"Como organizamos a negociação?",ex:"conduzimos o RFP com três finalistas; agenda em três blocos: solução técnica, TCO e SLA, e só então preço e BAFO",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"Quem abre a conversa — nós ou eles? Quem fala por nós em cada tema? Quantas rodadas prevemos, e qual é o objetivo de cada uma? Agenda: em que ordem os temas entram? Começamos pelos pontos fáceis, para criar acordo, ou pelos difíceis, enquanto há energia? Custos entram quando? Antes ou depois de fecharmos o entendimento técnico? Formato: presencial ou remoto, quanto tempo, com quantas pessoas de cada lado? Quem aprova o que combinarmos, do nosso lado — e em quanto tempo? Prazo: temos data-limite (vencimento do contrato atual, ciclo orçamentário)? Ela é conhecida pela outra parte? Deveria ser?"},{tipo:"q",id:"r2",n:2,q:"Como processamos a troca de informações?",ex:"o modelo de TCO e as metas de serviço saem cedo; o preço-alvo, o ranking e as propostas dos concorrentes não saem",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"O que revelamos — e em que momento da conversa? O que não revelamos em hipótese alguma? O que precisamos obter deles, e quem faz cada pergunta? Quem toma nota do que for dito, e como conferimos ao final de cada rodada? O que exigimos por escrito antes de avançar (proposta formal, minuta, confidencialidade)? Como validamos o que eles afirmarem — dá para pedir evidência, referência de cliente ou demonstração? Pausa: combinamos que qualquer um dos lados pode pedir intervalo para conferenciar?"},{tipo:"q",id:"r3",n:3,q:"Quais questões logísticas precisam ser resolvidas na negociação?",ex:"visita técnica antes da rodada comercial; ata circulada em dois dias após cada rodada",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"Data, hora, duração e local de cada encontro — e quem convoca. Documentos prontos antes: RFP e anexos, minuta de contrato, modelo de TCO, should-cost, propostas dos finalistas. Materiais de apoio: dados, laudos, referências e demonstrações que vamos levar ou pedir. Quem redige a ata ou o resumo do acordado — e em quantos dias circula. Quem assina o acordo final, e que ritos internos ele precisa cumprir antes. Canais: por onde a conversa continua entre as rodadas."}]},{id:"batna",t:"Analise e defina sua BATNA",curto:"BATNA",sub:"Sua melhor alternativa caso não haja acordo.",teoria:"posicao",itens:[{tipo:"q",id:"b1",n:1,q:"Quais são suas alternativas se a negociação encerrar sem um acordo?",ex:"fechar com o segundo finalista; dividir a malha entre dois operadores; prorrogar o incumbente com SLA revisado; internalizar parte da distribuição",rows:5},{tipo:"q",id:"b2",n:2,q:"Dessa lista, qual é sua melhor alternativa?",ex:"o segundo finalista, com TCO 3% acima — mas com menos escala e transição mais lenta"},{tipo:"num",n:3,t:"Você consegue melhorar sua BATNA?"},{tipo:"sub",id:"b3a",q:"Existe algum acordo que você possa fazer com outros clientes ou fornecedores que venha a melhorar sua BATNA?",ex:"manter o segundo finalista ativo até a assinatura e negociar com o incumbente uma prorrogação curta de contingência"},{tipo:"sub",id:"b3b",q:"Há alguma maneira de retirar ou de alterar qualquer limitação que neste momento enfraqueça sua BATNA? Em caso afirmativo, qual seria? Como?",ex:"a limitação é o vencimento do contrato: a prorrogação de contingência remove a nossa pressa sem custo"},{tipo:"sub",id:"b3c",q:"Há alguma maneira de alterar os termos da negociação de modo a melhorar sua BATNA? Em caso afirmativo, qual seria? Como?",ex:"dividir a malha em lotes regionais amplia o número de operadores capazes e reduz a dependência"},{tipo:"q",id:"b4",n:4,q:"Qual será sua nova BATNA se você conseguir melhorá-la?",ex:"segundo finalista contratável e incumbente prorrogável: podemos recusar uma BAFO acima do alvo sem risco de ruptura"}]},{id:"desistencia",t:"Determine sua posição de desistência",curto:"Desistência",sub:"O ponto menos favorável até o qual você ainda aceita um acordo.",teoria:"posicao",itens:[{tipo:"num",n:1,t:"Explorar as variáveis que afetam sua posição de desistência."},{tipo:"sub",id:"s1a",q:"Qual você acredita que seja atualmente o ponto menos favorável segundo o qual você aceitaria negociar um acordo?",ex:"TCO até 4% acima do alvo, com SLA de OTIF 97% e fórmula de reajuste indexada"},{tipo:"sub",id:"s1b",q:"Como ele se compara à sua BATNA? (Sua posição de desistência deve representar pelo menos uma pequena melhoria em relação à sua BATNA.)",ex:"nossa BATNA é o segundo finalista: TCO 3% acima mais custo de transição maior; o acordo precisa ficar abaixo dessa conta"},{tipo:"sub",id:"s1c",q:"Que outras variáveis você precisa considerar?",ex:"vencimento do contrato atual, capacidade de transição da operação e a saúde financeira do fornecedor"},{tipo:"sub",id:"s1d",q:"Se a negociação envolver dinheiro, qual é o valor mais baixo / mais alto que você consideraria?",ex:"teto: TCO do segundo finalista menos o diferencial de transição — acima disso, mudamos de fornecedor"},{tipo:"sub",id:"s1e",q:"Quais são as condições mínima / máxima não monetárias que você consideraria? (prazo, nível de serviço, garantias, retroatividade, contrapartidas, vigência)",ex:"mínimo: OTIF 97%, reajuste por fórmula e saída por desempenho. Máximo: contrato de 36 meses e volume mínimo garantido de 80%"},{tipo:"num",n:2,t:"Avaliar os trade-offs entre suas questões e interesses."},{tipo:"sub",id:"s2a",q:"Em que questões ou condições você está mais interessado? E menos interessado?",ex:"mais: SLA, fórmula de reajuste e cláusula de saída. Menos: a marca da frota e o calendário interno de faturamento do fornecedor"},{tipo:"sub",id:"s2b",q:"Algumas dessas condições ou questões estão relacionadas entre si? (Ou seja, mais ou menos do que você deseja em um ponto dá a você mais ou menos flexibilidade sobre algum outro?) Em caso afirmativo, quais?",ex:"garantir volume mínimo nos dá margem para exigir o preço-alvo; alongar o prazo, para exigir investimento em rastreamento"},{tipo:"sub",id:"s2c",q:"Até que ponto você aceita negociar ou trocar uma determinada questão ou condição?",ex:"volume mínimo, prazo e escalonamento são negociáveis; SLA de OTIF e fórmula de reajuste, não"},{tipo:"sub",id:"s2d",q:"Há outros arranjos para o acordo que teriam valor equivalente para você? Em caso afirmativo, mencione-os aqui.",ex:"em vez de preço, contrapartidas: torre de controle compartilhada, dados de rastreamento portáveis e plano de melhoria com ganho dividido"},{tipo:"num",n:3,t:"Considerando suas respostas acima, determine sua posição de desistência."},{tipo:"sub",id:"s3",q:"Você então poderá avaliar propostas alternativas em relação a essa posição de desistência.",ex:"“acima de 4% do alvo, sem OTIF 97% e sem fórmula de reajuste, não fechamos: assinamos com o segundo finalista e prorrogamos o incumbente por seis meses.”",rows:5},{tipo:"guia",t:"Confira antes de seguir",txt:"Ponha lado a lado o que você escreveu no Bloco 4 e no item 3 acima, e responda: se eu assinar esse pior acordo, fico melhor do que se eu não assinar nada e executar meu plano B? Se a resposta for “não” ou “dá na mesma”, a posição de desistência está no lugar errado. Ela precisa representar pelo menos uma pequena melhoria em relação à BATNA — do contrário, você estaria fechando um acordo pior do que simplesmente não fechar. Exemplo: você vende um carro e já tem outro comprador oferecendo R$ 40 mil, firme. Essa é a sua BATNA. Logo, sua posição de desistência não pode ser R$ 38 mil — teria de ser algo acima de R$ 40 mil."}]},{id:"mesa",t:"A mesa",curto:"A mesa",sub:"O que fica definido antes de a conversa começar.",teoria:"equacao",itens:[{tipo:"q",id:"m1",n:1,q:"Nossa frase de abertura (não pode conter número)",ex:"“Antes de falarmos de preço, queria entender como vocês montaram a operação para a nossa malha — e o que muda no custo conforme o desenho.”",rows:4},{tipo:"num",n:2,t:"O que cedemos e o que pedimos em troca"},{tipo:"nota",txt:"ex. ilustrativo: cedemos escalonamento em parcelas e pedimos metas de nível de serviço no aditivo."},{tipo:"tab",id:"trocas",cols:["O que cedemos (barato para nós, valioso para eles)","O que pedimos em troca"],chaves:["cede","pede"],linhas:4},{tipo:"num",n:3,t:"Quem participa por nós, e com que papel"},{tipo:"tab",id:"papeis",cols:["Papel","Nome"],chaves:["papel","nome"],linhas:4},{tipo:"guia",t:"Sugestão de papéis",txt:"Líder (conduz e pergunta) · técnico (viabilidade e escopo) · controller (guarda a posição de desistência e os números)."}]},{id:"sintese",t:"Síntese",curto:"Síntese",sub:"Uma página para levar à reunião.",teoria:"posicao",itens:[{tipo:"nota",txt:"Transcrevam aqui o essencial. Se vocês só puderem levar uma folha para a mesa, é esta."},{tipo:"q",id:"y1",q:"Negociação e objetivo em uma frase"},{tipo:"q",id:"y2",q:"Nossos três interesses principais",rows:4},{tipo:"q",id:"y3",q:"As três perguntas que precisamos fazer",rows:4},{tipo:"q",id:"y4",q:"Nossa BATNA"},{tipo:"q",id:"y5",q:"Nossa posição de desistência"},{tipo:"q",id:"y6",q:"Nosso critério objetivo principal"},{tipo:"q",id:"y7",q:"O que cedemos primeiro, e contra o quê"}]}],Gt=ka.flatMap(e=>e.itens.filter(o=>o.tipo==="q"||o.tipo==="sub").map(o=>({bloco:e.id,id:o.id}))),hs=ka.reduce((e,o)=>(e[o.id]=o.itens.filter(a=>a.tipo==="q"||a.tipo==="sub").map(a=>a.id),e),{}),vr={t:"Como usar este caderno",intro:"Este caderno é um roteiro de preparação. Vocês vão escolher uma negociação real da carteira de vocês — um sourcing em curso, uma renovação que se aproxima, um pedido de reajuste recebido — e prepará-la do começo ao fim. A perspectiva é a do comprador — vocês são o lado que contrata. A outra parte é o fornecedor atual ou o proponente.",ordem:[["Bloco 1 — Pessoas.","Quem decide, quem influencia, quem pode travar."],["Bloco 2 — Problemas.","Objetivos e interesses, soluções possíveis, justificativas e plano B."],["Bloco 3 — Processo.","Como a negociação vai acontecer."],["Bloco 4 — BATNA.","Sua melhor alternativa caso não haja acordo."],["Bloco 5 — Posição de desistência.","O ponto além do qual não vale fechar."],["Bloco 6 — A mesa.","Abertura, trocas e quem participa."]],orientacoes:[["Respostas curtas.","Um tópico por linha, não parágrafos."],["Só o que é público.","Usem o que está publicado no site e o que vocês já sabem do negócio. Se algo for confidencial ou incerto, não escrevam: anotem como pergunta a levar para a mesa."],["A linha em itálico é exemplo de formato,","sempre construída sobre o exemplo do sourcing de operador logístico — sirvam-se dela como modelo, não como resposta."]],fecho:"Ao final, vocês terão um documento que serve para uma negociação real — e um modelo reaproveitável para as próximas."},Gm=["Menor custo total","Maior confiabilidade","Maior qualidade","Maior agilidade","Menor risco de suprimento","Inovação do fornecedor"],Kt=["Sourcing de nova categoria (RFP / RFQ)","Renegociação de contrato vigente","Pedido de reajuste ou revisão de preço","Fornecedor único ou estratégico (SRM)","Renovação de acordo de fornecimento","Outro"],ys=()=>{let e={};return Gt.forEach(o=>{e[o.id]=""}),{id:Date.now(),nome:"",contraparte:"",tipo:Kt[0],emJogo:"",caderno:e,tabelas:{trocas:Array.from({length:4},()=>({cede:"",pede:""})),papeis:Array.from({length:4},()=>({papel:"",nome:""}))},pessoas:[],vcap:{ativos:"",processos:"",capacidades:"",impactos:[],outros:"",sintese:""}}},Vt=()=>{let e=ys();e.id=1,e.seedVersao=ic,e.nome="Sourcing de operador logístico para a distribuição regional (exemplo)",e.contraparte="LogVia Transportes (fictícia) — primeira colocada no RFP",e.tipo=Kt[0],e.emJogo="Contratar o operador logístico da distribuição regional para os próximos 36 meses, com TCO dentro do alvo, OTIF acima de 97% e sem recriar a dependência que o contrato atual gerou. Um bom acordo fecha preço por fórmula, não por rodada; registra o nível de serviço com bônus e penalidade; prevê saída por desempenho; e mantém viva a alternativa até a assinatura.";let o={d1:"Sourcing de operador logístico para a distribuição regional, via RFP com três finalistas.",d2:"É a segunda maior categoria de gasto da área. O contrato atual, com um único operador há sete anos, vence em seis meses; o OTIF caiu para 91% e o reajuste dos últimos dois anos superou a variação do diesel e do salário da categoria. A LogVia ficou em primeiro no ranking técnico e de TCO — 8% acima do preço-alvo.",d3:"Categoria de gargalo com tendência a estratégica: malha regional com exigências de rastreamento e janelas de entrega estreitas, e poucos operadores com escala. O RFP teve três finalistas: LogVia (primeira em técnica e TCO, 8% acima do alvo), TransNorte (segunda, 11% acima, transição mais lenta) e o incumbente (terceiro, sem plano de melhoria convincente). Resultado esperado: fechar com a LogVia dentro de 4% do alvo, OTIF 97% em SLA com consequência, fórmula paramétrica de reajuste, contrato de 36 meses com saída por desempenho e plano de transição de 90 dias — mantendo a TransNorte ativa até a assinatura.",p1:"Do nosso lado: o gerente de categoria (conduz) e o gerente de operações logísticas (responde pela realidade da malha), com o analista de custos preparando o TCO. Do lado da LogVia: o diretor comercial, que decide, e a gerente de operações, que responde pela entrega.",p2:"Nossa diretoria de supply chain aprova acima da alçada da gerência; o CFO assina contratos plurianuais, após parecer jurídico. Na LogVia, a proposta foi montada pelo controller — que não senta à mesa, mas define o piso que o diretor comercial pode aceitar.",p3:"As unidades atendidas pela distribuição, que sentem qualquer falha de entrega e pressionam por continuidade. O financeiro, que precisa do número para o orçamento do ano. O jurídico, que revisa a minuta. E o fornecedor incumbente, que reagirá à troca — com proposta tardia, com pressão sobre as unidades ou com degradação do serviço na transição.",q1:"Nossos objetivos, com fatos: TCO dentro de 4% do alvo (o should-cost por rota indica que os 8% da LogVia carregam margem de risco e custo de implantação recuperáveis); OTIF de 97% com medição nossa; fórmula de reajuste indexada a diesel, salário da categoria e INPC, com ponderação do should-cost; e saída por desempenho. Prioridades, em ordem: SLA com consequência, fórmula de reajuste, cláusula de saída, preço. Hipóteses sobre a outra parte (a confirmar na mesa): a LogVia quer entrar na região e usa a nossa malha como âncora de escala (?); tem capacidade ociosa no centro de distribuição da região (?); a margem embutida cobre incerteza de volume, e volume mínimo garantido a reduz (?).",q2:"Fechar preço por fórmula: preço-alvo com reajuste paramétrico, em troca de volume mínimo garantido de 80% e contrato de 36 meses. SLA com escala de bônus e penalidade sobre OTIF e avarias, medido por nossa torre de controle. Saída por desempenho após dois trimestres abaixo da meta. Plano de transição de 90 dias com marcos e período de convivência com o incumbente. Ganho compartilhado sobre reduções de custo identificadas em conjunto — otimização de rotas, consolidação de cargas.",q3:"Modelo de TCO da categoria, com custo de falha e de transição explicitados. Should-cost de frete por rota, montado com dados de mercado e diesel. Propostas dos outros dois finalistas, como referência de mercado — sem revelar valores. Histórico de OTIF e avarias do contrato atual. Benchmark de SLA em contratos similares do setor.",q4:"Fechar com a TransNorte, mantida ativa até a assinatura, aceitando transição mais lenta. Alternativa secundária: prorrogar o incumbente por seis meses com SLA revisado e dividir a malha em dois lotes regionais na rodada seguinte.",r1:"Conduzimos o processo: RFP com critérios publicados e três finalistas. Três rodadas com propósito declarado: (1) técnica, sobre desenho da operação e capacidade, sem preço; (2) TCO e SLA, com nossa estrutura de custo apresentada e a fórmula de reajuste na mesa; (3) BAFO, com a minuta do contrato já revisada pelo jurídico. Formato: reuniões de 90 minutos, no máximo três pessoas por lado, ata em dois dias. Do nosso lado, a gerência aprova até a alçada em poucos dias; acima disso, a diretoria leva duas semanas. Temos data-limite pelo vencimento do contrato — e a prorrogação de contingência já negociada faz com que ela não nos pressione.",r2:"Sai cedo: o modelo de TCO (estrutura, não valores), as metas de serviço e o histórico de falhas do incumbente. Não sai em hipótese alguma: o preço-alvo, o ranking e os valores dos concorrentes, nossa alçada e a existência da prorrogação de contingência. Precisamos obter deles: cost breakdown por rota, capacidade ociosa e plano de frota, composição da margem de risco e o que muda no custo com volume garantido. O gerente de operações faz as perguntas técnicas; o gerente de categoria, as comerciais. Um integrante fica sem falar, apenas registrando o que a contraparte diz e as reações. Ao fim de cada rodada, conferimos em voz alta o que foi combinado.",r3:"Visita técnica ao centro de distribuição da LogVia antes da rodada comercial. Should-cost e TCO montados com o analista de custos e validados pelo gerente de operações. Documentos prontos: RFP e anexos, propostas dos finalistas, histórico de desempenho do incumbente, minuta de contrato com SLA e fórmula de reajuste. O gerente de categoria redige a ata e circula em dois dias. O CFO assina após parecer jurídico. Entre as rodadas, e-mail apenas para registro — nunca para negociar termos.",b1:"Quatro alternativas mapeadas: (a) fechar com a TransNorte, segunda colocada, mantida ativa até a assinatura; (b) prorrogar o incumbente por seis meses com SLA revisado e relançar o RFP em dois lotes regionais; (c) dividir a malha entre dois operadores desde já, ao custo de coordenação; (d) internalizar as rotas de maior densidade com frota dedicada — indesejada e de implantação lenta.",b2:"A TransNorte: TCO 3% acima da proposta da LogVia e transição mais lenta, mas tecnicamente aprovada e sem dependência prévia. Vale, portanto, o TCO da LogVia mais 3% mais o diferencial de transição — é essa conta que define quanto o acordo com a LogVia precisa ser melhor. Não é confortável, mas é real e verificável.",b3a:"Sim: manter a TransNorte formalmente ativa no processo, com validade de proposta estendida, e negociar com o incumbente uma prorrogação curta de contingência com SLA revisado. Isso transforma a alternativa de ideia em processo em andamento — e a LogVia percebe pelo processo, sem anúncio.",b3b:"A limitação é o vencimento do contrato atual em seis meses. A prorrogação de contingência remove a nossa principal fonte de urgência sem custo relevante — e o vencimento deixa de ser uma data que a contraparte pode usar como pressão contra nós.",b3c:"Sim: redesenhar a malha em dois lotes regionais na minuta, com opção de adjudicar cada lote a operadores diferentes. Amplia o número de operadores capazes, reduz a dependência futura e sinaliza, sem dizer, que single sourcing não é o único desenho na mesa.",b4:"Com a TransNorte ativa, o incumbente prorrogável e a malha desenhada em lotes, a BATNA passa a ser: contratar o segundo colocado sem ruptura, ou dividir a malha, sem perder o calendário. Podemos recusar uma BAFO acima do alvo sem risco de ruptura relevante.",s1a:"TCO até 4% acima do alvo, com fórmula paramétrica de reajuste, OTIF 97% em SLA com consequência, saída por desempenho e transição de 90 dias — em troca de volume mínimo de 80% e 36 meses.",s1b:"Nossa BATNA é a TransNorte: TCO da LogVia mais 3% mais o custo de transição adicional. O acordo precisa ficar abaixo dessa conta — senão não vale fechar. A margem existe, o que nos permite negociar sem ansiedade.",s1c:"Vencimento do contrato atual e capacidade da operação de absorver a transição sem degradar o serviço. Pressão das unidades por continuidade. Reação do incumbente. E a saúde financeira da LogVia na expansão regional: caixa curto do outro lado é risco de suprimento, não vantagem a explorar — por isso qualquer garantia de volume será vinculada a desempenho, não antecipada.",s1d:"Teto: TCO da TransNorte menos o diferencial de transição — na prática, 4% acima do alvo. Acima disso, mudamos de fornecedor. O piso não é relevante: proposta muito abaixo do should-cost indicaria erro de cálculo ou lance insustentável, e viraria pergunta, não comemoração.",s1e:"Mínimo, inegociável: OTIF 97% medido por nós, fórmula de reajuste com cesta e ponderação acordadas, saída por desempenho e dados de rastreamento portáveis. Máximo que aceitamos conceder: 36 meses de contrato, volume mínimo de 80% e escalonamento do preço-alvo em dois degraus no primeiro ano.",s2a:"Mais interessados: SLA com consequência, fórmula de reajuste, cláusula de saída e portabilidade dos dados. Menos interessados: a marca e a idade da frota (desde que atendam à especificação), o calendário interno de faturamento da LogVia e o desenho das rotas internas dela.",s2b:"Sim. Garantir volume mínimo nos dá margem para exigir o preço-alvo — reduz a incerteza que a margem de risco deles precifica. Alongar para 36 meses nos dá margem para exigir investimento em rastreamento e frota dedicada. Já ceder na fórmula de reajuste não nos compra nada que valha: transfere o risco de custo inteiro para nós por três anos.",s2c:"Volume mínimo, prazo e escalonamento do preço são negociáveis. SLA de OTIF, fórmula de reajuste, saída por desempenho e portabilidade dos dados não são negociáveis.",s2d:"Sim: em vez de preço, contrapartidas — torre de controle compartilhada com dados em tempo real, plano de otimização de rotas com ganho dividido meio a meio e capacitação da nossa equipe na ferramenta de roteirização. Para a LogVia custa pouco; para nós, reduz o custo de troca futuro — exatamente o que fortalece nossa posição na renovação.",s3:"Acima de 4% do alvo, sem OTIF 97% com consequência, sem fórmula de reajuste ou sem saída por desempenho — não fechamos. Assinamos com a TransNorte, ativamos a prorrogação de contingência do incumbente e conduzimos a transição no nosso calendário.",m1:"“Antes de falarmos de preço, queria entender como vocês desenharam a operação para a nossa malha — e o que muda no custo de vocês conforme o desenho. E uma combinação: se em algum momento a gente for injusto com vocês, avisem, que a gente corrige.”",y1:"Contratar a LogVia como operador logístico da distribuição regional por 36 meses, dentro de 4% do preço-alvo, com SLA de OTIF 97% e fórmula de reajuste — sem recriar a dependência do contrato atual.",y2:"Nível de serviço com consequência contratual. Reajuste por fórmula, não por rodada. Alternativa viva até a assinatura e saída por desempenho.",y3:"O que compõe, por rota, o custo de vocês — e o que muda com volume garantido? Que capacidade ociosa e que plano de frota vocês têm para a região? Como vamos medir, em número e com que fonte, o OTIF e as avarias?",y4:"Fechar com a TransNorte, mantida ativa, ao custo de TCO 3% maior e transição mais lenta — com prorrogação de contingência do incumbente já negociada.",y5:"Até 4% acima do alvo, com OTIF 97%, fórmula de reajuste e saída por desempenho. Acima disso, assinamos com a TransNorte.",y6:"Should-cost de frete por rota, ponderado no modelo de TCO da categoria, conferido contra as propostas dos finalistas e o benchmark de SLA do setor.",y7:"Cedemos volume mínimo primeiro — contra o preço-alvo. Depois, prazo de 36 meses — contra investimento em rastreamento e frota dedicada."};return Object.keys(o).forEach(a=>{e.caderno[a]=o[a]}),e.tabelas={trocas:[{cede:"Volume mínimo garantido de 80%",pede:"Preço-alvo com fórmula paramétrica de reajuste"},{cede:"Contrato de 36 meses",pede:"Investimento em rastreamento, frota dedicada e dados portáveis"},{cede:"Escalonamento do preço em dois degraus no primeiro ano",pede:"SLA de OTIF 97% com bônus, penalidade e saída por desempenho"},{cede:"Plano de otimização de rotas em conjunto",pede:"Ganho compartilhado meio a meio sobre as reduções identificadas"}],papeis:[{papel:"Líder — conduz e pergunta",nome:"Gerente de categoria"},{papel:"Técnico — realidade da operação",nome:"Gerente de operações logísticas"},{papel:"Controller — guarda a desistência e os números",nome:"Analista de custos"},{papel:"Observador — registra falas e reações",nome:"Analista de compras júnior"}]},e.pessoas=[{nome:"Diretor comercial da LogVia (decide)",estilo:"catalisador"},{nome:"Gerente de operações da LogVia (responde pela entrega)",estilo:"analitico"},{nome:"Controller da LogVia (não senta à mesa, define o piso)",estilo:"controlador"}],e.vcap={ativos:"Modelo de TCO da categoria e should-cost por rota — ativos que permanecem nossos e servem a este sourcing, à renovação e às revisões de preço. Torre de controle compartilhada com dados de rastreamento portáveis, exigida no contrato. Histórico de desempenho medido por nós, não pelo fornecedor.",processos:"Rotina de sourcing com critérios publicados antes das propostas e alternativa mantida viva até a assinatura. Gestão de SLA que converte indicador medido em consequência contratual. Revisão de preço por fórmula, com cesta e ponderação acordadas, no lugar da rodada anual de pleito.",capacidades:"Capacidade de decompor o custo de frete e negociar sobre should-cost, o que nos torna comprador qualificado nesta categoria e nas próximas. Capacidade de trocar de operador sem ruptura, sustentada por dados portáveis e plano de transição. Capacidade de decidir a renovação por desempenho demonstrado, não por dependência.",impactos:["Menor custo total","Maior confiabilidade","Menor risco de suprimento"],outros:"Saída da dependência de operador único na segunda maior categoria de gasto da área.",sintese:"A negociação desenvolve ativos (TCO, should-cost, torre de controle) e transforma processos (sourcing, gestão de SLA, revisão por fórmula) — mas o que sustenta o argumento de valor é a capacidade nova: decompor custo e trocar de operador sem ruptura. Sem essa capacidade habilitada, C é igual a zero e a estrutura multiplicativa zera o valor inteiro: o comprador teria apenas trocado de fornecedor pelo mesmo grau de dependência. O impacto se materializa em custo total, confiabilidade e risco de suprimento."},e},Km=`
:root{
  --navy:#0E2A47; --navy-2:#16395E;
  --gold:#C9A227; --gold-soft:#F1E8CB; --gold-dim:#8A6D1D;
  --paper:#F7F4EC; --card:#fff; --ink:#22303E; --mut:#66717F; --line:#E3DECF;
  --serif:Cambria,Caladea,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --rail:248px; --measure:1180px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --shadow:0 1px 2px rgba(14,42,71,.04), 0 8px 24px -12px rgba(14,42,71,.12);
  --shadow-up:0 2px 4px rgba(14,42,71,.06), 0 16px 40px -16px rgba(14,42,71,.20);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
::selection{background:var(--gold-soft)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

/* ---- barra superior ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);
  border-bottom:3px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  padding:var(--s3) var(--s6)}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;border:none;background:none;padding:0;text-align:left}
.brand-t{font-family:var(--serif);font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.brand-t em{font-style:normal;font-weight:400;color:var(--gold)}
.brand-n{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:#9FB0C2}
.topnav{display:flex;align-items:center;gap:var(--s5)}
.topnav .tn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gold);
  background:none;border:none;cursor:pointer;padding:6px 2px;position:relative;transition:color .18s}
.topnav .tn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .22s}
.topnav .tn:hover{color:#fff}
.topnav .tn:hover::after,.topnav .tn.on::after{transform:scaleX(1)}
.ver{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#7E93A8;padding-left:var(--s4);border-left:1px solid rgba(255,255,255,.14)}

/* ---- estrutura: trilha lateral + conteúdo ---- */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 74px)}
.rail{width:var(--rail);flex:0 0 var(--rail);border-right:1px solid var(--line);
  background:#FBF9F3;padding:var(--s6) 0;display:flex;flex-direction:column}
.railhead{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);padding:0 var(--s5) var(--s3)}
.railitem{display:flex;align-items:baseline;gap:var(--s3);width:100%;text-align:left;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--mut);
  background:none;border:none;border-left:3px solid transparent;cursor:pointer;
  padding:10px var(--s5);transition:color .16s,background .16s,border-color .16s}
.railitem:hover{color:var(--navy);background:rgba(201,162,39,.07)}
.railitem.on{color:var(--navy);font-weight:700;background:var(--gold-soft);border-left-color:var(--gold)}
.railitem .rc{font-family:var(--sans);font-size:11px;color:var(--mut);margin-left:auto;font-weight:400}
.railitem.on .rc{color:var(--gold-dim)}
.subrail{margin:2px 0 var(--s4)}
.subrail .railitem{font-size:13.5px;padding-left:calc(var(--s5) + 14px)}
.railfoot{margin-top:auto;padding:var(--s5) var(--s5) 0;border-top:1px solid var(--line)}
.railfoot p{font-family:var(--serif);font-size:13.5px;font-style:italic;color:var(--navy);
  margin:var(--s4) 0 6px;line-height:1.45}
.railfoot span{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut)}

.main{flex:1;min-width:0}
.page{max-width:var(--measure);margin:0 auto;padding:var(--s7) var(--s6) var(--s8)}
.page.wide{max-width:1420px}

/* ---- cabeçalho de página ---- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--s5);flex-wrap:wrap;padding-bottom:var(--s4);
  border-bottom:1px solid var(--line);margin-bottom:var(--s6)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:var(--s2)}
h1.h1{font-family:var(--serif);font-size:34px;line-height:1.12;font-weight:700;
  color:var(--navy);margin:0;letter-spacing:-.01em}
.lede{font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--mut);
  max-width:74ch;margin:0 0 var(--s6)}

/* ---- botões ---- */
.btn{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  padding:11px 22px;border-radius:6px;background:var(--navy);color:#fff;
  border:1px solid var(--navy);transition:background .16s,transform .12s,box-shadow .16s;white-space:nowrap}
.btn:hover{background:var(--navy-2);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:rgba(14,42,71,.06);box-shadow:none}
.btn.sm{font-size:12.5px;padding:7px 14px}

.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;
  padding:6px 14px;border-radius:999px;background:transparent;color:var(--navy);
  border:1px solid var(--gold);margin:0 6px 6px 0;transition:background .16s,color .16s}
.chip:hover{background:var(--gold-soft)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.tlink{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--gold-dim);
  background:none;border:none;cursor:pointer;padding:4px 0;display:inline-flex;
  align-items:center;gap:5px;transition:color .16s}
.tlink:hover{color:var(--navy)}
.tlink-arrow{display:inline-block;transition:transform .2s}
.tlink:hover .tlink-arrow{transform:translateX(3px)}

/* ---- painéis e campos ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.campo{margin-bottom:var(--s4)}
.lbl{font-family:var(--sans);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);margin-bottom:7px;line-height:1.45}
.inp{width:100%;padding:12px 14px;font-family:var(--serif);font-size:16.5px;line-height:1.6;
  color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;
  transition:border-color .16s,box-shadow .16s;resize:vertical}
.inp:hover{border-color:#CFC7B2}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.13)}
.inp::placeholder{color:#A9B2BC;font-style:italic}

/* ---- grade de projetos ---- */
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:24px;cursor:pointer;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:var(--s4);
  transition:border-color .18s,box-shadow .18s,transform .18s}
.pcard:hover{border-color:var(--gold);box-shadow:var(--shadow-up);transform:translateY(-2px)}
.pcard-t{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);
  line-height:1.25;margin:0}
.pcard-m{font-family:var(--sans);font-size:12.5px;color:var(--mut);line-height:1.5}
.pcard-b{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-top:auto}
.pct{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);line-height:1;text-align:right}
.pct small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}

/* ---- medidor de preparação por bloco do caderno ---- */
.gauge{display:flex;gap:3px;align-items:flex-end;flex:1}
.gauge .seg{flex:1;min-width:10px;height:28px;background:#EDE8DA;border-radius:2px;
  position:relative;overflow:hidden}
.gauge .seg i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);
  transition:height .35s cubic-bezier(.4,0,.2,1)}
.gauge.lg .seg{height:44px}
.gaugekey{display:flex;gap:3px;margin-top:7px}
.gaugekey span{flex:1;min-width:10px;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--mut);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- estado vazio ---- */
.empty{border:1px dashed #CFC7B2;border-radius:10px;padding:var(--s8) var(--s6);
  text-align:center;background:rgba(255,255,255,.55)}
.empty h3{font-family:var(--serif);font-size:21px;color:var(--navy);margin:0 0 var(--s2)}
.empty p{font-family:var(--serif);font-size:15px;color:var(--mut);margin:0 auto var(--s5);max-width:44ch;line-height:1.6}

/* ---- cartões de teoria ---- */
.tcard{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:8px;padding:20px 24px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
  transition:border-color .18s,box-shadow .18s}
.tcard:hover{border-left-color:var(--gold);box-shadow:var(--shadow)}
.tcard.open{border-left-color:var(--gold);box-shadow:var(--shadow)}
.secmark{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px;margin:var(--s6) 0 var(--s4)}

/* ---- utilitários ---- */
h2.h2{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);margin:0 0 10px;line-height:1.25}
.sub{font-family:var(--serif);font-size:16.5px;color:var(--mut);line-height:1.65;margin:0 0 var(--s5);max-width:78ch;text-align:justify;hyphens:auto}
.stack>*+*{margin-top:var(--s4)}


/* ---- prosa: medida editorial, maior e justificada ---- */
.prose{font-family:var(--serif);font-size:17px;line-height:1.68;color:var(--ink);
  text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;margin:0}
.prose+.prose{margin-top:14px}
.tbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);
  gap:var(--s6);align-items:start;margin-top:18px}
.tbody .fullspan{grid-column:1/-1}
.gloss{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 7px 7px 0;
  padding:16px 18px;font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink)}
.gloss b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:7px}
@media (max-width:1180px){
  .tbody{grid-template-columns:1fr;gap:var(--s4)}
}

/* ---- caderno: campos em duas colunas em telas largas ---- */
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
  gap:0 var(--s6)}
.campos .campo{margin-bottom:var(--s5)}
@media (max-width:900px){ .campos{grid-template-columns:1fr} }

/* ---- zona de exclusão ---- */
.danger{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.danger p{font-family:var(--sans);font-size:12.5px;color:var(--mut);margin:0;max-width:52ch;line-height:1.5}
.btn.warn{background:transparent;color:#9C3F2E;border-color:#D8B4AB}
.btn.warn:hover{background:#FBEDE9;box-shadow:none}
.btn.warn.armed{background:#9C3F2E;color:#fff;border-color:#9C3F2E}
.pcard-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;
  border:none;background:transparent;color:#A9B2BC;font-size:17px;line-height:1;cursor:pointer;
  opacity:0;transition:opacity .16s,background .16s,color .16s}
.pcard{position:relative}
.pcard:hover .pcard-x{opacity:1}
.pcard-x:hover{background:#FBEDE9;color:#9C3F2E}
.pcard-x.armed{opacity:1;background:#9C3F2E;color:#fff;width:auto;padding:0 10px;font-family:var(--sans);font-size:11px;font-weight:700}


/* ---- caderno: exemplos, orientações, itens numerados, tabelas ---- */
.exemplo{font-family:var(--serif);font-size:13.5px;font-style:italic;color:#8A8F97;
  line-height:1.5;margin:-2px 0 7px}
.campo.sub{padding-left:16px;border-left:2px solid var(--line)}
.numhead{grid-column:1/-1;font-family:var(--serif);font-size:17px;font-weight:700;
  color:var(--navy);margin:var(--s4) 0 var(--s3);padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.guia{grid-column:1/-1;background:#F4F6F8;border-left:3px solid #8FA3B8;border-radius:0 7px 7px 0;
  padding:15px 18px;margin:0 0 var(--s5);font-family:var(--serif);font-size:14.5px;
  line-height:1.62;color:var(--ink);text-align:justify;hyphens:auto}
.guia b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#4E6478;margin-bottom:7px;font-weight:700}
.notinha{grid-column:1/-1;font-family:var(--serif);font-size:14px;font-style:italic;
  color:var(--mut);margin:0 0 var(--s4);line-height:1.55}
.ordem-l{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--ink);margin-bottom:7px}
.ordem-l strong{color:var(--navy)}
.tabwrap{grid-column:1/-1;overflow-x:auto;margin:0 0 var(--s5)}
.tabpre{width:100%;border-collapse:collapse;min-width:520px}
.tabpre th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.04em;line-height:1.35}
.tabpre td{border:1px solid var(--line);padding:0}
.inpcel{width:100%;border:none;background:transparent;padding:11px 12px;
  font-family:var(--serif);font-size:15.5px;color:var(--ink);outline:none}
.inpcel:focus{background:rgba(201,162,39,.09)}

/* impressão: orientações e exemplos são andaimes, não saem no dossiê */


/* ---- dossiê: tabelas e destaque da síntese ---- */
.dtab{width:100%;border-collapse:collapse;margin:6px 0 16px;font-family:var(--serif);font-size:15px}
.dtab th{background:var(--navy);color:#fff;text-align:left;padding:8px 11px;
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em}
.dtab td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;line-height:1.5}
.dsintese{background:var(--gold-soft);border:1px solid var(--gold);border-radius:9px;
  padding:20px 24px;margin:var(--s5) 0}
.dsintese .dsec{margin-top:0;border-bottom-color:var(--gold)}


/* ---- quadro de referência: selos, tabela e nota ---- */
.selo{display:inline-block;font-family:var(--sans);font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px;
  border:1px solid;margin:0 5px 4px 0;white-space:nowrap}
.qselos{display:flex;flex-wrap:wrap;margin-top:8px}
.quadro-filtros{display:flex;flex-wrap:wrap;margin:4px 0 var(--s4)}
.quadro-filtros .qn{opacity:.55;font-weight:400;margin-left:3px}
.quadro-desc{font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--mut);
  margin:0 0 var(--s4);line-height:1.55}
.quadro{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14.5px;
  margin:0 0 var(--s5)}
.quadro th{background:var(--navy);color:#fff;text-align:left;padding:10px 13px;
  font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;vertical-align:bottom}
.quadro td{border-bottom:1px solid var(--line);padding:14px 13px;vertical-align:top;
  line-height:1.55;text-align:left}
.quadro tr:nth-child(even) td{background:#FCFAF5}
.quadro .qt{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.3}
.quadro .qs{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--mut);margin-top:2px}
.quadro .qtaesa{border-left:2px solid var(--gold);background:rgba(241,232,203,.28)}
.quadro tr:nth-child(even) .qtaesa{background:rgba(241,232,203,.45)}
.quadro-nota{background:#F4F6F8;border-left:3px solid #8FA3B8;border-radius:0 7px 7px 0;
  padding:15px 18px;font-family:var(--serif);font-size:14px;line-height:1.62;color:var(--ink)}
.quadro-nota b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#4E6478;margin-bottom:8px}
.quadro-nota p{margin:0 0 9px;text-align:justify;hyphens:auto}
.quadro-nota p:last-child{margin-bottom:0}
.taesa{background:#E8EDF3;border-left:3px solid var(--navy);border-radius:0 7px 7px 0;
  padding:15px 18px;font-family:var(--serif);font-size:15px;line-height:1.62;color:var(--ink);
  text-align:justify;hyphens:auto}
.taesa b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--navy);margin-bottom:7px;font-weight:700}



/* ---- sobre o autor ---- */
.autor{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);
  gap:var(--s7);align-items:start}
.autor-cartao{background:var(--navy);border-radius:11px;padding:30px 26px;
  text-align:center;position:sticky;top:96px}
.autor-foto{width:120px;height:120px;border-radius:50%;margin:0 auto var(--s4);
  display:block;object-fit:cover;border:3px solid var(--gold)}
.autor-mono{display:flex;align-items:center;justify-content:center;
  background:#16395E;color:var(--gold);font-family:var(--serif);font-size:40px;
  font-weight:700;letter-spacing:.04em}
.autor-nome{font-family:var(--serif);font-size:20px;font-weight:700;color:#fff;line-height:1.25}
.autor-papel{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--gold);
  margin-top:6px;padding-top:0}
.autor-cargo{font-family:var(--sans);font-size:12px;color:#9FB0C2;margin-top:12px;
  line-height:1.5;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.autor-link{display:inline-block;margin-top:16px;font-family:var(--sans);font-size:13px;
  font-weight:600;color:var(--navy);background:var(--gold);padding:9px 20px;
  border-radius:6px;text-decoration:none;transition:opacity .16s}
.autor-link:hover{opacity:.86}
.autor-corpo .secmark{margin-top:34px}
.cred{list-style:none;padding:0;margin:0 0 var(--s5)}
.cred li{position:relative;padding-left:22px;margin-bottom:12px;
  font-family:var(--serif);font-size:16px;line-height:1.5}
.cred li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;
  background:var(--gold);border-radius:1px}
.cred-t{color:var(--ink);display:block;font-weight:700}
.cred-o{color:var(--mut);font-size:14.5px;font-style:italic}
.livros{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s4)}
.livro{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:22px 20px 18px;display:flex;flex-direction:column;
  text-decoration:none;color:inherit;
  transition:border-color .18s,box-shadow .18s,transform .18s}
.livro:hover{border-color:var(--gold);box-shadow:var(--shadow-up);transform:translateY(-2px)}
.livro:hover .livro-ir{color:var(--navy)}
.livro:hover .tlink-arrow{transform:translateX(3px)}
.livro-rule{width:34px;height:3px;background:var(--gold);margin-bottom:14px}
.livro-t{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--navy);
  margin:0 0 8px;line-height:1.32}
.livro-s{font-family:var(--serif);font-size:14px;color:var(--mut);margin:0 0 14px;
  line-height:1.5;flex:1}
.livro-meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin-top:auto;padding-top:13px;border-top:1px solid var(--line)}
.livro-ir{color:var(--gold-dim);font-weight:700;white-space:nowrap;transition:color .16s}
.livro-nota{font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--mut);
  margin:var(--s4) 0 0;line-height:1.55}
@media (max-width:900px){
  .autor{grid-template-columns:1fr;gap:var(--s5)}
  .autor-cartao{position:static;display:flex;align-items:center;gap:var(--s5);
    text-align:left;padding:22px}
  .autor-foto{width:84px;height:84px;margin:0;flex-shrink:0}
  .autor-mono{font-size:30px}
  .autor-cargo{border-top:none;padding-top:6px;margin-top:6px}
  .autor-link{margin-top:10px}
  .autor-corpo .secmark{margin-top:26px}
}


/* ---- referências ---- */
.ref{border-left:2px solid var(--line);padding:0 0 0 18px;margin-bottom:22px;
  transition:border-color .18s}
.ref:hover{border-left-color:var(--gold)}
.ref-cit{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink);
  text-indent:-18px;padding-left:18px}
.ref-a{font-variant:small-caps;letter-spacing:.02em;color:var(--navy);font-weight:700}
.ref-t{font-style:italic}
.ref-d{color:var(--mut)}
.ref-l{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold-dim);text-decoration:none;white-space:nowrap;
  display:inline-flex;align-items:center}
.ref-l:hover{color:var(--navy)}
.ref-l:hover .tlink-arrow{transform:translateX(3px)}
.ref-onde{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--mut);
  margin-top:7px}
.ref-onde b{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold-dim);display:block;margin-bottom:3px;font-weight:700}
@media (max-width:820px){
  .ref{padding-left:14px;margin-bottom:19px}
  .ref-cit{font-size:15px;text-indent:0;padding-left:0}
}


/* ---- contatos e QR no cartão do autor ---- */
.autor-acoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.autor-link.ghost{background:transparent;color:var(--gold);
  border:1px solid rgba(201,162,39,.55)}
.autor-link.ghost:hover{background:rgba(201,162,39,.14);opacity:1}
.autor-tel{font-family:var(--sans);font-size:12.5px;color:#9FB0C2;margin-top:10px;
  letter-spacing:.03em}
.qr{margin:18px 0 0;padding:14px 0 0;border-top:1px solid rgba(255,255,255,.14)}
.qr .qrimg{width:132px;height:132px;display:block;margin:0 auto;
  background:#fff;padding:7px;border-radius:6px}
.qr figcaption{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;
  color:#8FA1B4;margin-top:9px;line-height:1.45}
@media (max-width:900px){
  .autor-acoes{justify-content:flex-start}
  .qr{border-top:none;padding-top:0;margin-top:14px}
  .qr .qrimg{margin:0;width:112px;height:112px}
  .qr figcaption{text-align:left}
}
@media (max-width:820px){
  .autor-acoes{justify-content:center}
  .qr .qrimg{margin:0 auto}
  .qr figcaption{text-align:center}
}
@media print{ .qr,.autor-acoes{display:none} }


/* ---- legenda das figuras ---- */
.figbloco{margin:0}
.figleg{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--mut);
  margin:9px 0 0;padding-left:13px;border-left:2px solid var(--gold);text-align:left}
@media (max-width:820px){ .figleg{font-size:13.5px} }

/* ---- responsivo ---- */
@media (max-width:1080px){
  :root{--rail:212px}
  .page{padding:var(--s6) var(--s5) var(--s7)}
  h1.h1{font-size:29px}
}

/* ---------- celular e tablet estreito ---------- */
@media (max-width:820px){
  html{overflow-x:hidden}
  body{-webkit-tap-highlight-color:rgba(201,162,39,.18)}

  /* barra superior compacta: só a marca; a navegação vive na trilha */
  .topbar{padding:11px var(--s4);gap:var(--s3);
    padding-left:max(var(--s4),env(safe-area-inset-left));
    padding-right:max(var(--s4),env(safe-area-inset-right))}
  .brand-t{font-size:15.5px;line-height:1.25}
  .brand-x{display:none}
  .brand-n{font-size:10.5px;letter-spacing:.06em}
  .topnav{display:none}

  /* trilha vira faixa horizontal rolável, presa abaixo da barra */
  .shell{display:block}
  .rail{position:sticky;top:57px;z-index:40;
    width:auto;flex:none;background:#FBF9F3;
    border-right:none;border-bottom:1px solid var(--line);
    display:block;padding:0;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>.railgroup{display:flex;align-items:stretch;width:max-content;min-width:100%;
    padding-left:max(0px,env(safe-area-inset-left))}
  .rail>.railfoot{display:none}
  .railhead{display:none}
  .railsep{width:1px;flex:0 0 1px;background:var(--line);margin:9px 6px}
  .subrail{margin:0;display:contents}
  .railitem{width:auto;flex:0 0 auto;white-space:nowrap;
    border-left:none;border-bottom:3px solid transparent;
    padding:14px var(--s4);font-size:14.5px;min-height:48px;align-items:center}
  .railitem.on{border-left-color:transparent;border-bottom-color:var(--gold);
    background:transparent;color:var(--navy)}
  .railitem:hover{background:transparent}
  .railitem .rc{margin-left:7px}
  .subrail .railitem{padding-left:var(--s4);font-size:14px}
  .subrail .railitem::before{content:"";display:inline-block;width:5px;height:5px;
    border-radius:50%;background:var(--gold);margin-right:8px;opacity:.45;align-self:center}
  .subrail .railitem.on::before{opacity:1}

  /* conteúdo */
  .page,.page.wide{padding:var(--s5) var(--s4) var(--s8);
    padding-left:max(var(--s4),env(safe-area-inset-left));
    padding-right:max(var(--s4),env(safe-area-inset-right))}
  h1.h1{font-size:24px;letter-spacing:0}
  .eyebrow{font-size:10px;letter-spacing:.14em}
  .pagehead{flex-direction:column;align-items:stretch;gap:var(--s4);
    padding-bottom:var(--s3);margin-bottom:var(--s5)}
  .pagehead .btn{width:100%;text-align:center;padding:13px 20px}
  .lede{font-size:16px;max-width:none}
  .sub{font-size:15.5px;text-align:left;hyphens:none}
  .prose{font-size:16px;text-align:left;hyphens:none}
  .panel{padding:18px 16px;border-radius:9px}

  /* cartões de projeto */
  .grid{grid-template-columns:1fr;gap:var(--s3)}
  .pcard{padding:20px 18px}
  .pcard-t{font-size:18.5px}
  .pcard-x{opacity:1;top:10px;right:10px}
  .gauge .seg{height:22px}
  .pct{font-size:23px}

  /* teoria */
  .tcard{padding:17px 16px}
  .tbody{gap:var(--s4);margin-top:14px}
  .gloss{padding:14px 15px;font-size:15px}

  /* caderno */
  .campos{grid-template-columns:1fr;gap:0}
  .campo.sub{padding-left:12px}
  .guia{padding:13px 15px;font-size:14px;text-align:left;hyphens:none}
  .numhead{font-size:16px}
  .inp{font-size:16px}
  .exemplo{font-size:13px}

  /* tabelas viram fichas empilhadas, sem rolagem lateral */
  .tabwrap{overflow:visible}
  .tabpre{min-width:0;display:block}
  .tabpre thead{display:none}
  .tabpre tbody{display:block}
  .tabpre tr{display:block;border:1px solid var(--line);border-radius:8px;
    margin-bottom:10px;overflow:hidden}
  .tabpre td{display:block;border:none;border-bottom:1px solid var(--line);position:relative}
  .tabpre tr td:last-child{border-bottom:none}
  .tabpre td::before{content:attr(data-rot);display:block;
    font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--mut);padding:9px 12px 0}
  .inpcel{padding:5px 12px 11px;font-size:15.5px}

  /* sobre o autor */
  .autor-cartao{flex-direction:column;text-align:center;gap:var(--s3)}
  .autor-foto{margin:0 auto}
  .cred li{font-size:15.5px}
  .livros{grid-template-columns:1fr}

  /* quadro de referência empilha */
  .quadro{display:block;font-size:15px}
  .quadro thead{display:none}
  .quadro tbody{display:block}
  .quadro tr{display:block;border:1px solid var(--line);border-radius:9px;
    margin-bottom:12px;overflow:hidden;background:#fff}
  .quadro tr:nth-child(even) td{background:transparent}
  .quadro td{display:block;border-bottom:1px solid var(--line);padding:13px 15px}
  .quadro tr td:last-child{border-bottom:none}
  .quadro td::before{content:attr(data-rot);display:block;font-family:var(--sans);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  .quadro td:first-child::before{display:none}
  .quadro .qtaesa{border-left:none;border-top:2px solid var(--gold);
    background:rgba(241,232,203,.35)!important}
  .quadro-nota,.taesa{padding:13px 15px;font-size:14px;text-align:left;hyphens:none}
  .quadro-nota p{text-align:left;hyphens:none}

  /* dossiê */
  .dtab{font-size:14px;display:block}
  .dtab thead{display:none}
  .dtab tbody{display:block}
  .dtab tr{display:block;border:1px solid var(--line);border-radius:7px;margin-bottom:9px}
  .dtab td{display:block;border:none;border-bottom:1px solid var(--line);padding:9px 11px}
  .dtab tr td:last-child{border-bottom:none}
  .dtab td::before{content:attr(data-rot);display:block;font-family:var(--sans);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .dsintese{padding:16px 15px}
}

/* ---------- telas muito estreitas ---------- */
@media (max-width:400px){
  .brand-t{font-size:14.5px}
  h1.h1{font-size:21px}
  .railitem{padding:13px 13px;font-size:13.5px}
  .panel{padding:15px 13px}
  .pcard{padding:17px 15px}
  .pcard-b{flex-direction:column;align-items:stretch;gap:var(--s3)}
  .pct{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  /* preserva navy, dourado e fundos — sem isto o navegador imprime tudo em branco */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{size:A4;margin:16mm 15mm}
  html,body{background:#fff}
  .topbar,.rail,.so-tela,.pagehead{display:none!important}
  .shell{display:block}
  .main{display:block}
  .page,.page.wide{max-width:none;margin:0;padding:0}
  .panel{border:none;border-radius:0;padding:0;background:transparent}
  .dossie{border-top:none!important}

  /* corpo do documento impresso */
  body{font-size:10.5pt;line-height:1.5}
  .prose{font-size:10.5pt;line-height:1.5;text-align:justify}
  .dsec{font-size:13pt;page-break-after:avoid;break-after:avoid}
  .ditem{page-break-inside:avoid;break-inside:avoid}
  .dblock{page-break-inside:auto}
  .dcapa{page-break-inside:avoid;break-inside:avoid}

  /* nada de órfãos e viúvas */
  p,div{orphans:3;widows:3}
  h1,h2,h3,.h2{page-break-after:avoid;break-after:avoid}

  /* lembretes começam em página nova */
  .dlembretes{page-break-before:always;break-before:page}
  .dsintese{page-break-after:always;break-after:page;page-break-inside:avoid;
    border:2px solid #C9A227;padding:14px 16px}
  .dtab{page-break-inside:avoid;break-inside:avoid;font-size:9.5pt}

  /* figuras e tabelas inteiras */
  svg,table,.gloss,.note,.taesa,.quadro-nota{page-break-inside:avoid;break-inside:avoid}
  .quadro tr{page-break-inside:avoid;break-inside:avoid}

  /* links não precisam de destaque no papel */
  .tlink,.btn,.chip{display:none!important}
  .guia,.exemplo,.notinha{display:none!important}
}
